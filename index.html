<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#1d4ed8">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--txt:#111827;--sub:#5b6472;--line:#e2e6ec;
  --pri:#1d4ed8;--pri-h:#1e40af;--pri-s:#e8efff;
  --verde:#15803d;--verde-s:#dcfce7;--rojo:#b91c1c;--rojo-s:#fee2e2;--ama:#a16207;--ama-s:#fef3c7;
  --r:12px;--sombra:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 2px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub)}
p{margin:0 0 8px}
.sub{color:var(--sub);font-size:13px}
.pre{white-space:pre-line}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* Layout */
.layout{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding:16px 16px 96px;max-width:1240px;margin:0 auto;width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.bottom button.act{color:var(--pri);font-weight:600}
.bottom svg,.side svg{width:22px;height:22px}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;padding:18px 12px}
  .side .marca{padding:0 10px 18px}
  .side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:10px;text-align:left;color:var(--txt)}
  .side button:hover{background:var(--bg)}
  .side button.act{background:var(--pri-s);color:var(--pri);font-weight:600}
  .side .pie{margin-top:auto;padding:10px;font-size:12px;color:var(--sub)}
  .bottom{display:none}
  main{padding:28px 32px 48px}
}
.marca{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.marca .logo{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:14px}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.seccion{margin:22px 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sombra)}
.vacio{padding:18px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
/* Estados */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.verde{background:var(--verde-s);color:var(--verde)}.rojo{background:var(--rojo-s);color:var(--rojo)}.amarillo{background:var(--ama-s);color:var(--ama)}.gris{background:#eef0f3;color:var(--sub)}.azul{background:var(--pri-s);color:var(--pri)}
.eq{border-left:5px solid var(--line);display:flex;flex-direction:column;gap:8px}
.eq.b-verde{border-left-color:var(--verde)}.eq.b-rojo{border-left-color:var(--rojo)}.eq.b-amarillo{border-left-color:#d4a514}
.eq-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.eq-cod{font-weight:700;font-size:17px}
.eq-ocup{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px}
.eq-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.alerta{background:var(--ama-s);color:#713f12;border-radius:8px;padding:8px 10px;font-size:13px}
.alerta.roja{background:var(--rojo-s);color:#7f1d1d}
.aviso{display:flex;gap:10px;align-items:center;background:var(--pri);color:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.aviso button{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;padding:6px 10px}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:24px}
.kpi .fila-k{display:flex;gap:6px;flex-wrap:wrap}
/* Listas */
.lista{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fila{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fila:last-child{border-bottom:0}
.fila .crece{flex:1;min-width:0}
.fila.click{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.fila.click:hover{background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px}
.chip.act{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap}
.tabs button.act{background:var(--txt);color:#fff;border-color:var(--txt)}
dl.ficha{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dl.ficha dt{color:var(--sub)}dl.ficha dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12.5px}
.tabla-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;font-weight:600}
.btn:hover{background:var(--pri-h)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:#fff;color:var(--txt);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--pri)}
.btn.peligro{background:var(--rojo);border-color:var(--rojo)}
.btn.chico{min-height:34px;padding:0 12px;font-size:13.5px}
.btn.bloque{width:100%}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:12px}
label input,label select,label textarea{display:block;width:100%;margin-top:5px;font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input[type=time],input[type=search],input:not([type]),select,textarea{border:1px solid #cfd5dd;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-s);border-color:var(--pri)}
fieldset{border:0;padding:0;margin:0 0 12px}
legend{font-weight:600;font-size:13.5px;margin-bottom:6px;padding:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg legend{width:100%}
.seg label{flex:1;min-width:130px;margin:0;font-weight:500;border:1px solid #cfd5dd;border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer}
.seg label:has(input:checked){border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
.seg input{width:auto;margin:0}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{font-weight:500;display:flex;gap:6px;align-items:center;margin:0;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.checks input{width:auto;margin:0}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.form-grid{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
/* Modal y toast */
.modal-fondo{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal-fondo{align-items:center}.modal{border-radius:18px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{background:#111827;color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);white-space:pre-line}
.toast.error{background:var(--rojo)}
@media(min-width:900px){#toast{bottom:24px}}
.cargando{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--sub)}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(100%,400px);padding:26px}
.login .marca{margin-bottom:18px}
.inline-check{display:flex;gap:8px;align-items:center;font-weight:500}
.inline-check input{width:auto;margin:0}
.fila-retro .fila-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
/* Modo televisor */
body.modo-tv{background:#0b1220;color:#e5e7eb;font-size:clamp(14px,1.25vw,30px)}
.tv{padding:2vw}
.tv-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vw}
.tv-cab h1{font-size:2.2em;color:#fff}
.tv-reloj{font-size:2.4em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.tv-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:1vw;margin-bottom:1.6vw}
.tv-res div{background:#111a2e;border-radius:.6em;padding:.8em 1em}
.tv-res b{display:block;font-size:2em;color:#fff}
.tv h2{font-size:1.3em;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin:1.2em 0 .6em}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:1vw}
.tv-eq{border-radius:.6em;padding:.8em 1em;background:#111a2e;border-left:.4em solid #374151}
.tv-eq.verde{border-left-color:#22c55e}.tv-eq.rojo{border-left-color:#ef4444}.tv-eq.amarillo{border-left-color:#eab308}
.tv-eq .c{font-size:1.5em;font-weight:700;color:#fff}
.tv-eq .e{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.95em;margin:.2em 0}
.tv-eq.verde .e{color:#4ade80}.tv-eq.rojo .e{color:#f87171}.tv-eq.amarillo .e{color:#facc15}
.tv-eq .d{color:#cbd5e1;font-size:.9em}
.tv-error{display:grid;place-items:center;min-height:100vh;font-size:1.6em;padding:2em;text-align:center}
</style>
</head>
<body data-modo="<?= modo ?>" data-tv="<?= tvToken ?>">
<div id="app"></div>
<div id="modal-raiz"></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
 * LabControl — cliente
 * ========================================================= */
var MODO = document.body.dataset.modo || 'app';
var TV_TOKEN = document.body.dataset.tv || '';
var S = {
  token: null, usuario: null, config: {}, msgs: {}, turno: null, notifEmail: false,
  vista: 'inicio', param: null, datos: null, sug: null, modal: false,
  avisos: [], filtroEq: 'TODOS', buscaEq: '', encTab: 'recibidos', adminTab: 'usuarios',
  retro: null, usuariosEnc: null, encDest: null, _res: null
};
var ROL_TXT = { ANALISTA: 'Analista', REVISOR: 'Revisor', JEFATURA: 'Jefatura' };
var AREA_TXT = { MP: 'Materias Primas', PT: 'Producto Terminado', AMBAS: 'Ambas áreas' };
var DIAS = ['', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
var EST = { DISPONIBLE: ['verde', 'Disponible'], OCUPADO: ['rojo', 'Ocupado'], NO_OPERATIVO: ['amarillo', 'No operativo'] };

var ICO = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  eq: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 9h4M7 12h7"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  msg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  mas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>'
};

/* ---------- Utilidades ---------- */
function $(s) { return document.querySelector(s); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function puede() { var r = Array.prototype.slice.call(arguments); return !!S.usuario && r.some(function (x) { return S.usuario.roles.indexOf(x) >= 0; }); }
function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function jparse(s, d) { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } }
var store = {
  get: function (k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v, persistente) { try { (persistente ? localStorage : sessionStorage).setItem(k, v); } catch (e) { } },
  del: function (k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { } }
};
function fh(iso) { if (!iso) return '—'; var d = new Date(iso); return d.toLocaleString('es-CL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function hora(iso) { return iso ? new Date(iso).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : ''; }
function fecha(iso) { return new Date(iso).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fdia(ymd) { if (!ymd) return '—'; var p = ymd.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function dur(ini, fin) {
  var ms = (fin ? new Date(fin) : new Date()) - new Date(ini);
  var m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60);
  return h ? h + ' h ' + (m % 60) + ' min' : m + ' min';
}
function aLocal(d) { function p(n) { return String(n).padStart(2, '0'); } return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function deLocal(s) { if (!s) return ''; var d = new Date(s); return isNaN(d) ? '' : d.toISOString(); }
function hoyYMD() { return aLocal(new Date()).slice(0, 10); }
function badge(e) { var x = EST[e]; return '<span class="badge ' + x[0] + '"><i></i>' + x[1] + '</span>'; }
function chipEstadoEnc(e) { return e.estado === 'REVISADO' ? '<span class="badge verde"><i></i>Revisado</span>' : '<span class="badge amarillo"><i></i>Pendiente de revisión</span>'; }
function rolesChips(roles) { return roles.map(function (r) { return '<span class="badge azul">' + ROL_TXT[r] + '</span>'; }).join(' '); }
function cargandoHtml() { return '<div class="cargando"><div class="spin"></div>Cargando…</div>'; }
function primerNombre() { return S.usuario ? S.usuario.nombre.split(' ')[0] : ''; }

function toast(msg, tipo) {
  var t = document.createElement('div');
  t.className = 'toast' + (tipo === 'error' ? ' error' : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(function () { t.remove(); }, tipo === 'error' ? 6000 : 3500);
}

/* ---------- Comunicación con Apps Script ---------- */
function api(accion, datos) {
  return new Promise(function (ok, ko) {
    if (!window.google || !google.script || !google.script.run) {
      ko(new Error('Abre esta página desde la URL de la aplicación web de Apps Script.'));
      return;
    }
    google.script.run
      .withSuccessHandler(function (txt) {
        var r = jparse(txt, null);
        if (!r) return ko(new Error('Respuesta inválida del servidor.'));
        if (r.ok) return ok(r.data);
        if (r.error === 'SESION') { cerrarLocal(); return ko(new Error('Tu sesión expiró. Ingresa nuevamente.')); }
        ko(new Error(r.error));
      })
      .withFailureHandler(function (e) { ko(new Error((e && e.message) || 'Error de conexión.')); })
      .api(S.token, accion, datos || {});
  });
}

/* ---------- Modal ---------- */
function modal(html) {
  S.modal = true;
  $('#modal-raiz').innerHTML = '<div class="modal-fondo" data-fondo="1"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  var f = $('#modal-raiz [autofocus]');
  if (f) setTimeout(function () { f.focus(); }, 30);
}
function cerrarModal() { S.modal = false; $('#modal-raiz').innerHTML = ''; }
function confirmar(texto, boton, titulo, peligro) {
  return new Promise(function (res) {
    S._res = res;
    modal('<h2>' + esc(titulo || 'Confirmar') + '</h2><p class="pre">' + esc(texto) + '</p>' +
      '<div class="acciones"><button class="btn sec" data-a="resNo">Cancelar</button>' +
      '<button class="btn' + (peligro ? ' peligro' : '') + '" data-a="resSi" autofocus>' + esc(boton || 'Confirmar') + '</button></div>');
  });
}
/** Muestra un mensaje informativo configurable. Si está inactivo y hay texto alternativo, pide una confirmación simple. */
function mensajeInformativo(clave, alternativo) {
  var m = S.msgs && S.msgs[clave];
  if (m && m.activo) {
    return new Promise(function (res) {
      S._res = res;
      modal('<h2>' + esc(m.titulo) + '</h2><p class="pre">' + esc(m.texto) + '</p>' +
        '<div class="acciones"><button class="btn sec" data-a="resNo">Cancelar</button><button class="btn" data-a="resSi" autofocus>' + esc(m.boton) + '</button></div>');
    });
  }
  return alternativo ? confirmar(alternativo, 'Continuar') : Promise.resolve(true);
}
function pedirMotivoLiberacion(ds) {
  var m = (S.msgs && S.msgs.LIBERAR_TERCERO) || {};
  var activo = m.activo;
  return new Promise(function (res) {
    S._res = res;

/* ---------- Navegación ---------- */
function navItems() {
  var it = [['inicio', 'Inicio', ICO.home], ['equipos', 'Equipos', ICO.eq], ['reservas', 'Reservas HPLC', ICO.cal]];
  if (puede('ANALISTA', 'JEFATURA')) { it.push(['encargos', 'Encargos', ICO.msg]); it.push(['retro', 'Registro disolutores', ICO.list]); }

}
function vistaNav() { return S.vista === 'equipo' ? 'equipos' : S.vista; }
function shell() {
  var items = navItems(), v = vistaNav();
  var side = items.map(function (i) { return '<button data-a="ir" data-v="' + i[0] + '" class="' + (v === i[0] ? 'act' : '') + '">' + i[2] + '<span>' + i[1] + '</span></button>'; }).join('');
  var abajo = items.filter(function (i) { return ['inicio', 'equipos', 'reservas', 'encargos'].indexOf(i[0]) >= 0; });
  var enMas = items.filter(function (i) { return abajo.indexOf(i) < 0; }).some(function (i) { return i[0] === v; });
  var bottom = abajo.map(function (i) { return '<button data-a="ir" data-v="' + i[0] + '" class="' + (v === i[0] ? 'act' : '') + '">' + i[2] + '<span>' + (i[0] === 'reservas' ? 'Reservas' : i[1]) + '</span></button>'; }).join('') +
    '<button data-a="menuMas" class="' + (enMas ? 'act' : '') + '">' + ICO.mas + '<span>Más</span></button>';
  return '<div class="layout"><nav class="side"><div class="marca"><span class="logo">LC</span>LabControl</div>' + side +
    '<div class="pie">' + esc(S.usuario.nombre) + '<br>' + S.usuario.roles.map(function (r) { return ROL_TXT[r]; }).join(' + ') + '</div></nav>' +
    '<main id="contenido">' + contenido() + '</main><nav class="bottom">' + bottom + '</nav></div>';
}
function render() {
  var app = $('#app');
  if (!S.token || !S.usuario) { app.innerHTML = vLogin(); return; }
  if (S.usuario.debe_cambiar_clave) { app.innerHTML = '<div class="login"><div class="card">' + vCambioClave(true) + '</div></div>'; return; }
  app.innerHTML = shell();
  iniciarPolling();
}
function pintar() {
  if (!$('#contenido')) return render();
  $('#contenido').innerHTML = contenido();
  document.querySelectorAll('[data-a="ir"]').forEach(function (b) { b.classList.toggle('act', b.dataset.v === vistaNav()); });
}
function ir(vista, param) {
  S.vista = vista; S.param = param || null; S.datos = null;
  if (!$('#contenido')) render(); else pintar();
  window.scrollTo(0, 0);
  return cargar();
}
function cargar(silencioso) {
  var v = S.vista, p = S.param, pr;
  if (v === 'inicio') pr = api('inicio');
  else if (v === 'equipos') pr = api('equipos');
  else if (v === 'equipo') pr = api('equipo', { id: p });
  else if (v === 'reservas') pr = api('reservas');
  else if (v === 'encargos') pr = api('encargos', { todos: S.encTab === 'todos' });
  else if (v === 'admin') pr = api('adminDatos');
  else if (v === 'perfil') pr = api('yo');
  else if (v === 'retro') pr = asegurarSug().then(function () { return {}; });
  else pr = Promise.resolve({});
  return pr.then(function (d) {
    if (S.vista !== v || S.param !== p) return;
    S.datos = d;
    if (d && d.config) S.config = d.config;
    if (d && d.mensajes) S.msgs = d.mensajes;
    if (v === 'inicio' && d.avisos && d.avisos.length) {
      d.avisos.forEach(function (a) { S.avisos.push(a); toast(a.texto); });
    }
    if (silencioso) {
      var foco = document.activeElement;
      if (S.modal || (foco && $('#contenido') && $('#contenido').contains(foco) && /INPUT|SELECT|TEXTAREA/.test(foco.tagName))) return;
    }
    pintar();
  }).catch(function (e) {
    if (!silencioso) { toast(e.message, 'error'); if (S.token) pintar(); }
  });
}
function asegurarSug() {
  if (S.sug) return Promise.resolve(S.sug);
  return api('sugerencias').then(function (s) { S.sug = s; return s; });
}

/* ---------- Contenido por vista ---------- */
function contenido() {
  var d = S.datos;
  if (S.vista === 'retro') return S.sug ? vRetro() : cargandoHtml();
  if (!d) return cargandoHtml();
  switch (S.vista) {
    case 'inicio': return vInicio(d);
    case 'equipos': return vEquipos(d);
    case 'equipo': return vEquipo(d);
    case 'reservas': return vReservas(d);
    case 'encargos': return vEncargos(d);
    case 'admin': return vAdmin(d);
    case 'perfil': return vPerfil(d);
  }
  return '';
}

function puedeLiberarTercero() { var r = (S.config && S.config.roles_liberar_tercero) || ['ANALISTA', 'JEFATURA']; return puede.apply(null, r); }

/* ---------- Registro retrospectivo de disolutores ---------- */
function filaRetroVacia(base) {
  base = base || {};
  return { equipo_id: base.equipo_id || '', producto: base.producto || '', area: base.area || '', lotes: base.lotes || '', ensayo: base.ensayo || '', inicio: '', fin: '' };
}
function vRetro() {
  var dis = S.sug.equipos.filter(function (e) { return e.tipo === 'DISOLUTOR'; });
  if (!S.retro) S.retro = [filaRetroVacia()];
  var h = '<div class="cab"><div><h1>Registro de disolutores</h1><p class="sub">Registra al final del turno los usos ya realizados. Quedan identificados como retrospectivos y no cambian el estado actual del equipo.</p></div></div>';
  if (!dis.length) return h + '<div class="vacio">No hay disolutores registrados.</div>';

function actualizarSugProd(form) {
  if (!form || !S.sug) return;

  if (!p) { if (dl) dl.innerHTML = ''; if (chips) chips.innerHTML = ''; return; }
  var radio = form.querySelector('input[name=area][value="' + p.area + '"]');

  if (radio && form.dataset.ultProd !== p.id) { radio.checked = true; form.dataset.ultProd = p.id; }
  if (dl) dl.innerHTML = S.sug.ensayos.filter(function (x) { return x.producto_id === p.id; }).map(function (x) { return '<option value="' + esc(x.nombre) + '">'; }).join('');

function fdatos(f) {
  var o = {};
  new FormData(f).forEach(function (v, k) {
    if (o[k] !== undefined) { if (!Array.isArray(o[k])) o[k] = [o[k]]; o[k].push(v); } else o[k] = v;
  });
  return o;
}
function lista(v) { return v === undefined ? [] : (Array.isArray(v) ? v : [v]); }

document.addEventListener('click', function (ev) {
  if (ev.target.dataset && ev.target.dataset.fondo) { ACC.cerrarModal(); return; }
  var el = ev.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  var fn = ACC[el.dataset.a];
  if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el.dataset, el, ev); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.tagName === 'INPUT' && el.dataset.a && ACC[el.dataset.a]) ACC[el.dataset.a](el.dataset, el, ev);
  if (el.dataset.r !== undefined && el.dataset.k && S.retro) actualizarFilaRetro(el);
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset.prod) actualizarSugProd(el.form);
  if (el.dataset.r !== undefined && el.dataset.k && S.retro) actualizarFilaRetro(el);
  if (el.dataset.busca === 'eq') {
    S.buscaEq = el.value;
    var pos = el.selectionStart;
    pintar();
    var n = document.querySelector('[data-busca="eq"]');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
  }
  if (el.dataset.busca === 'enc') {
    S._qEnc = el.value;
    var q = norm(el.value);
    $('#lista-enc').innerHTML = listaEncHtml((S.usuariosEnc || []).filter(function (u) { return !q || norm(u.nombre).indexOf(q) >= 0; }));
  }
});
document.addEventListener('focusin', function (ev) { if (ev.target.dataset && ev.target.dataset.sel) ev.target.select(); });
function actualizarFilaRetro(el) {
  var f = S.retro[Number(el.dataset.r)];
  if (!f) return;
  f[el.dataset.k] = el.value;
  if (el.dataset.k === 'producto') {
    var p = productoPorNombre(el.value);
    if (p && !f.area) {
      f.area = p.area;
      var sel = document.querySelector('select[data-r="' + el.dataset.r + '"][data-k="area"]');
      if (sel) sel.value = p.area;
    }
  }
}
document.addEventListener('submit', function (ev) {
  var f = ev.target, nombre = f.dataset.f;
  if (!nombre || !FORM[nombre]) return;
  ev.preventDefault();
  var btn = f.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  var p;
  try { p = Promise.resolve(FORM[nombre](fdatos(f), f)); } catch (e) { p = Promise.reject(e); }
  p.then(function (msg) {
    if (btn) btn.disabled = false;
    if (msg === 'silencio' || msg === undefined) return;
    cerrarModal(); toast(msg); cargar();
  }).catch(function (e) { if (btn) btn.disabled = false; toast(e.message, 'error'); });
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.modal) ACC.cerrarModal(); });

/* ---------- Sesión ---------- */
function cargarYo() {
  return api('yo').then(function (d) {
    S.usuario = d.usuario; S.config = d.config; S.msgs = d.mensajes; S.notifEmail = d.notif_email_activo;
    return d;
  });
}
function cerrarLocal() {
  S.token = null; S.usuario = null; S.datos = null; S.sug = null; S.avisos = []; S.retro = null;
  store.del('lc_token');
  cerrarModal(); render();
}
function iniciarPolling() {
  if (S._poll) return;
  S._poll = setInterval(function () {
    if (!S.token || !S.usuario || S.usuario.debe_cambiar_clave || document.hidden || S.modal) return;
    if (['inicio', 'equipos', 'equipo', 'reservas', 'encargos'].indexOf(S.vista) < 0) return;
    cargar(true);
  }, Math.max(10, (S.config && S.config.segundos_refresco) || 20) * 1000);
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.token && S.usuario && !S.modal && ['inicio', 'equipos', 'equipo', 'reservas', 'encargos'].indexOf(S.vista) >= 0) cargar(true);
});

/* ---------- Modo televisor ---------- */
function pintarTV(d) {
  var reloj = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
  if (!d) { $('#app').innerHTML = '<div class="tv-error">Cargando panel…</div>'; return; }
  var tile = function (e) {
    var col = EST[e.estado][0];
    var det = e.estado === 'OCUPADO' ? (e.area ? e.area + ' · ' : '') + (e.ensayo ? esc(e.ensayo) + ' · ' : '') + dur(e.inicio)
      : e.estado === 'DISPONIBLE' && e.proxima ? 'Reservado desde ' + hora(e.proxima) : '';
    return '<div class="tv-eq ' + col + '"><div class="c">' + esc(e.codigo) + '</div><div class="e">' + EST[e.estado][1] + '</div><div class="d">' + det + '</div></div>';
  };
  var r = d.resumen;
  var hplc = d.equipos.filter(function (e) { return e.tipo === 'HPLC'; }), dis = d.equipos.filter(function (e) { return e.tipo === 'DISOLUTOR'; });
  $('#app').innerHTML = '<div class="tv"><div class="tv-cab"><h1>' + esc(d.laboratorio || 'LabControl') + '</h1><div class="tv-reloj" id="tv-reloj">' + reloj + '</div></div>' +
    '<div class="tv-res"><div>HPLC disponibles<b>' + r.HPLC.DISPONIBLE + ' / ' + hplc.length + '</b></div><div>Disolutores disponibles<b>' + r.DISOLUTOR.DISPONIBLE + ' / ' + dis.length + '</b></div>' +
    '<div>No operativos<b>' + (r.HPLC.NO_OPERATIVO + r.DISOLUTOR.NO_OPERATIVO) + '</b></div><div>Usos activos MP<b>' + d.actividades.MP + '</b></div><div>Usos activos PT<b>' + d.actividades.PT + '</b></div></div>' +
    (hplc.length ? '<h2>HPLC</h2><div class="tv-grid">' + hplc.map(tile).join('') + '</div>' : '') +
    (dis.length ? '<h2>Disolutores</h2><div class="tv-grid">' + dis.map(tile).join('') + '</div>' : '') + '</div>';
}
function iniciarTV() {
  document.body.classList.add('modo-tv');
  pintarTV(null);
  var tick = function () {
    api('tvEstado', { tv: TV_TOKEN }).then(function (d) { pintarTV(d); setTimeout(tick, (d.segundos || 20) * 1000); })
      .catch(function (e) { $('#app').innerHTML = '<div class="tv-error">' + esc(e.message) + '</div>'; setTimeout(tick, 60000); });
  };
  tick();
  setInterval(function () { var c = $('#tv-reloj'); if (c) c.textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }); }, 10000);
}

/* ---------- Arranque ---------- */
function boot() {
  if (MODO === 'tv') { iniciarTV(); return; }
  S.token = store.get('lc_token');
  if (!S.token) { render(); return; }
  $('#app').innerHTML = cargandoHtml();
  cargarYo().then(function () {
    render();
    iniciarPolling();
    if (!S.usuario.debe_cambiar_clave) ir('inicio');
  }).catch(function () { cerrarLocal(); });
}
boot();
</script>
