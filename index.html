<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabControl</title>
<meta name="theme-color" content="#f2f4f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f2f4f7;--surface:#fff;--raised:#eceef2;--border:#e1e5ea;--rule:#eef0f3;--control:#cfd5dc;
  --text:#0f1419;--muted:#5b6572;--faint:#6b7480;--primary:#141414;
  --hue:#1d5fbf;--hue-s:#e7eefa;
  --ok:#247b50;--ok-bg:#dcfae5;--ok-ink:#04250e;
  --bad:#c4242a;--bad-bg:#ffedea;--bad-ink:#831c1e;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-ink:#92400e;--warn-line:#fde68a;
  --neu-bg:#eceef2;--neu-ink:#3d4650;
  --r-card:8px;--r-ctl:6px;--gap:12px;--pad:24px;--h-ctl:36px;
  --ease:cubic-bezier(.23,1,.32,1);
  --font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--ground);color:var(--text);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:16px;line-height:22px;font-weight:600;margin:0}
h3{font-size:13px;line-height:18px;font-weight:600;color:var(--muted);margin:0 0 8px}
p{margin:0 0 8px}
a{color:var(--hue)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.sub{color:var(--muted);font-size:13px;line-height:18px}
.muted{color:var(--muted)}
.pre{white-space:pre-line}
.mono,.eq-cod,.mono-s{font-family:var(--mono)}
.mono-s{font-size:12px;color:var(--muted)}
.num,.kpi-v,.cuenta{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}

/* ===== Estructura ===== */
.layout{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding:20px 16px 96px;max-width:1240px;margin:0 auto;width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;background:none;border:0;min-height:56px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;line-height:14px;color:var(--muted);transition:color 120ms ease}
.bottom button.act{color:var(--text);font-weight:600}
.bottom button:active{transform:scale(.96)}
.bottom svg,.nav-item svg{width:20px;height:20px;flex-shrink:0}
.marca{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.marca-svg{width:28px;height:28px;flex-shrink:0;display:block}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;width:244px;flex-shrink:0;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;padding:20px 12px 14px;overflow-y:auto}
  .side .marca{padding:0 8px 16px}
  .ambito{margin:0 0 4px;padding:9px 10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-ctl);line-height:17px}
  .ambito b{display:block;font-size:13px;font-weight:600}
  .ambito small{color:var(--muted);font-size:12px}
  .nav-grupo{margin-top:22px}
  .nav-tit{font-size:12px;color:var(--muted);padding:0 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;height:32px;margin-bottom:2px;padding:0 10px;background:none;border:0;border-radius:var(--r-ctl);text-align:left;color:var(--muted);transition:background-color 120ms ease,color 120ms ease}
  .nav-item svg{width:16px;height:16px}
  .nav-item.act{background:#e5e8ed;color:var(--text);font-weight:500}
  .user-row{margin-top:auto;display:flex;align-items:center;gap:10px;width:100%;padding:8px;background:none;border:0;border-radius:var(--r-ctl);text-align:left;transition:background-color 120ms ease}
  .user-row b{display:block;font-size:13px;font-weight:500;line-height:17px}
  .user-row small{display:block;color:var(--muted);font-size:12px;line-height:16px}
  .user-row.act{background:#e5e8ed}
  .bottom{display:none}
  main{padding:32px 40px 56px}
}
@media(hover:hover) and (pointer:fine){
  .nav-item:hover,.user-row:hover{background:#e9ecf0}
  .nav-item.act:hover{background:#e5e8ed}
}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.cab .linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 0}
.seccion{margin:28px 0 8px}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid2{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dos{display:grid;gap:20px;align-items:start}
@media(min-width:1100px){.dos.con-aside{grid-template-columns:minmax(0,1fr) 320px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px}
.vacio{padding:14px 16px;text-align:center;color:var(--muted);background:transparent;border:1px dashed var(--control);border-radius:var(--r-card);font-size:13px}

/* ===== Estados y etiquetas ===== */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;line-height:1;font-weight:500;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.verde{background:var(--ok-bg);color:var(--ok-ink)}.verde i{background:var(--ok)}
.rojo{background:var(--bad-bg);color:var(--bad-ink)}.rojo i{background:var(--bad)}
.amarillo{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-line)}.amarillo i{background:var(--warn)}
.gris{background:var(--neu-bg);color:var(--neu-ink)}
.azul{background:var(--neu-bg);color:var(--neu-ink)}
.alerta{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:var(--r-ctl);padding:8px 10px;font-size:13px;line-height:18px;margin-top:6px}
.alerta.roja{background:var(--bad-bg);border-color:#f7c9c4;color:var(--bad-ink)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:600;flex-shrink:0;line-height:1}
.av.g{width:28px;height:28px;font-size:12px}

/* ===== Avisos y KPIs ===== */
.aviso{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--control);border-radius:var(--r-card);padding:10px 12px;margin-bottom:12px}
.aviso svg{width:18px;height:18px;flex-shrink:0}
.aviso span{flex:1}
.aviso button{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:var(--r-ctl)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--rule);border-top:1px solid var(--rule);text-align:left;background:none;border-right:0;border-bottom:0;display:block;width:100%}
.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(odd){border-left:0}
.kpi:last-child:nth-child(odd){grid-column:1/-1}
.kpi-l{display:block;color:var(--muted);font-size:13px;line-height:18px}
.kpi-v{display:block;font-size:28px;line-height:36px;font-weight:500;letter-spacing:-.02em;margin:2px 0}
.kpi-v small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.kpi-s{display:block;color:var(--muted);font-size:12px;line-height:16px}
@media(min-width:760px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{border-top:0}.kpi:nth-child(odd){border-left:1px solid var(--rule)}.kpi:first-child{border-left:0}
  .kpi:last-child:nth-child(odd){grid-column:auto}
}
@media(hover:hover) and (pointer:fine){button.kpi:hover{background:#fafbfc}}

/* ===== Tablero de equipos ===== */
.tablero{container-type:inline-size;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:16px}
.tablero-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.cuenta{color:var(--muted);font-weight:400;margin-left:4px}
.leyenda{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px}
.sw-uso{background:var(--hue)}
.sw-res{background:var(--hue-s);box-shadow:inset 0 0 0 1px var(--hue)}
.sw-ahora{width:2px;height:12px;background:var(--text);border-radius:0}
.eq-fila{display:grid;gap:8px 16px;padding:14px 16px;border-bottom:1px solid var(--rule);align-items:start;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id est" "uso uso" "tira tira" "acc acc"}
.eq-fila:last-child{border-bottom:0}
.eq-id{grid-area:id;display:flex;gap:10px;align-items:flex-start;min-width:0}
.eq-est{grid-area:est;justify-self:end}
.eq-uso{grid-area:uso;min-width:0}
.eq-tira{grid-area:tira}
.eq-acc{grid-area:acc;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.eq-acc:empty{display:none}
.pt{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--control)}
.pt-verde{background:var(--ok)}.pt-rojo{background:var(--bad)}.pt-amarillo{background:var(--warn)}
.eq-cod{background:none;border:0;padding:0;font-size:14px;line-height:20px;font-weight:500;color:var(--text);text-align:left}
.eq-cod:hover{text-decoration:underline;text-underline-offset:3px}
.eq-quien{display:flex;align-items:center;gap:8px;line-height:20px}
.eq-quien b{font-weight:500}
.tira{position:relative;height:20px;border-radius:3px;background:var(--rule)}
.tira i{position:absolute;top:0;bottom:0;display:block;font-style:normal}
.t-uso{background:var(--hue);border-radius:2px}
.t-res{background:var(--hue-s);box-shadow:inset 0 0 0 1px var(--hue);border-radius:2px}
.t-ahora{width:2px;margin-left:-1px;background:var(--text)}
@container (min-width:520px){
  .eq-fila{grid-template-columns:minmax(170px,230px) minmax(0,1fr) auto;grid-template-areas:"id uso est" "id tira acc"}
  .eq-est{justify-self:end}
}
@container (min-width:860px){
  .eq-fila{grid-template-columns:200px 118px minmax(0,1fr) 190px 128px;grid-template-areas:"id est uso tira acc";align-items:center}
  .eq-acc{justify-content:flex-end}
  .eq-acc:empty{display:block}
  .eq-est{justify-self:start}
  .pt{margin-top:6px}
}
@container (min-width:520px) and (max-width:859px){.eq-acc{justify-content:flex-end}.eq-fila{align-items:center}.eq-uso{align-self:start}}

/* ===== Listas, tablas, pestañas ===== */
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.fila:last-child{border-bottom:0}
.fila .crece{flex:1;min-width:0}
.fila b{font-weight:500}
.fila.click{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
@media(hover:hover) and (pointer:fine){.fila.click:hover{background:#fafbfc}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;border:1px solid var(--control);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px;transition:background-color 120ms ease,color 120ms ease}
.chip.act{background:var(--primary);border-color:var(--primary);color:#fff}
.chip:active{transform:scale(.97)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:500}
.tabs button.act{color:var(--text);border-bottom-color:var(--primary)}
dl.ficha{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0}
dl.ficha dt{color:var(--muted)}dl.ficha dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tabla-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}

/* ===== Botones y formularios ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-ctl);padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:500;white-space:nowrap;transition:transform 160ms var(--ease),background-color 120ms ease,border-color 120ms ease,opacity 120ms ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--control)}
.btn.ghost{background:none;border-color:transparent;color:var(--text)}
.btn.peligro{background:var(--bad);border-color:var(--bad)}
.btn.chico{height:30px;padding:0 11px;font-size:13px}
.btn.bloque{width:100%}
@media(hover:hover) and (pointer:fine){
  .btn:hover{background:#000}.btn.sec:hover,.btn.ghost:hover{background:#f1f3f6}.btn.peligro:hover{background:#a81e23}
}
label{display:block;font-weight:500;font-size:14px;margin-bottom:14px}
label .sub{font-weight:400}
label input,label select,label textarea{display:block;width:100%;margin-top:6px;font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input[type=time],input[type=search],input[type=number],input:not([type]),select,textarea{border:1px solid var(--control);border-radius:var(--r-ctl);padding:0 12px;background:var(--surface);height:40px;font-size:14px;transition:border-color 120ms ease,box-shadow 120ms ease}
textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--hue);box-shadow:0 0 0 3px rgba(29,95,191,.18)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[readonly]{background:var(--ground)}
@media(max-width:899px){input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input[type=time],input[type=search],input[type=number],input:not([type]),select,textarea{font-size:16px}}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:500;font-size:14px;margin-bottom:6px;padding:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg legend{width:100%}
.seg label{flex:1;min-width:130px;margin:0;font-weight:400;border:1px solid var(--control);border-radius:var(--r-ctl);padding:0 12px;height:40px;display:flex;gap:8px;align-items:center;cursor:pointer;background:var(--surface)}
.seg label:has(input:checked){border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:500}
.seg input{width:auto;height:auto;margin:0;accent-color:var(--primary)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{font-weight:400;display:flex;gap:8px;align-items:center;margin:0;border:1px solid var(--control);border-radius:999px;padding:0 12px;height:32px;background:var(--surface)}
.checks input,.inline-check input{width:auto;height:auto;margin:0;accent-color:var(--primary)}
.inline-check{display:flex;gap:8px;align-items:center;font-weight:400}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.form-grid{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fila-retro .fila-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}

/* ===== Diálogos y avisos ===== */
.modal-fondo{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fondo 160ms ease-out}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:sube 240ms var(--ease)}
.modal h2{font-size:18px;line-height:24px;margin-bottom:12px}
@media(min-width:640px){.modal-fondo{align-items:center}.modal{border-radius:12px;animation-name:entra}}
@keyframes fondo{from{opacity:0}}
@keyframes sube{from{transform:translateY(24px);opacity:.6}}
@keyframes entra{from{transform:scale(.97);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--primary);color:#fff;padding:10px 14px;border-radius:var(--r-ctl);font-size:14px;white-space:pre-line;box-shadow:0 8px 24px rgba(15,20,25,.2);animation:toast 220ms var(--ease)}
.toast.error{background:var(--bad)}
@keyframes toast{from{transform:translateY(8px);opacity:0}}
@media(min-width:900px){#toast{bottom:24px}}
.cargando{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--control);border-top-color:var(--primary);border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.sk{display:block;background:#e6e9ee;border-radius:4px}
.sk-wrap{max-width:100%}
.sk-fila{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--rule)}
.sk-fila:last-child{border-bottom:0}

/* ===== Ingreso ===== */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(100%,400px);padding:28px}
.login .marca{margin-bottom:22px}
.login h1,.login h2{font-size:20px;line-height:26px;margin-bottom:4px}
.login .nota{margin-top:18px;color:var(--muted);font-size:12px;line-height:17px}

/* ===== Modo televisor ===== */
body.modo-tv{background:#0b0f14;color:#e6e9ed;font-size:clamp(14px,1.25vw,30px);line-height:1.35}
.tv{padding:2vw}
.tv-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vw}
.tv-cab h1{font-size:2em;color:#fff;font-weight:600;line-height:1.2}
.tv-reloj{font-size:2.4em;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.tv-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:1vw;margin-bottom:1.6vw}
.tv-res div{background:#111821;border-radius:.5em;padding:.8em 1em;color:#b4bcc6}
.tv-res b{display:block;font-size:2em;color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.tv h2{font-size:1.2em;color:#b4bcc6;font-weight:500;margin:1.2em 0 .6em}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:1vw}
.tv-eq{border-radius:.5em;padding:.8em 1em;background:#111821;border-left:.35em solid #374151}
.tv-eq.verde{border-left-color:#3fc07a}.tv-eq.rojo{border-left-color:#e5566f}.tv-eq.amarillo{border-left-color:#f0b429}
.tv-eq .c{font-size:1.5em;font-weight:500;color:#fff;font-family:var(--mono)}
.tv-eq .e{font-weight:500;font-size:1em;margin:.2em 0}
.tv-eq.verde .e{color:#5fd69a}.tv-eq.rojo .e{color:#ff8097}.tv-eq.amarillo .e{color:#f5c75a}
.tv-eq .d{color:#b4bcc6;font-size:.9em}
.tv-error{display:grid;place-items:center;min-height:100vh;font-size:1.6em;padding:2em;text-align:center}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-raiz"></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
 * LabControl — cliente
 * ========================================================= */

/* ---------- Utilidades ---------- */
function $(s) { return document.querySelector(s); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function puede() { var r = Array.prototype.slice.call(arguments); return !!S.usuario && r.some(function (x) { return S.usuario.roles.indexOf(x) >= 0; }); }
function norm(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function jparse(s, d) { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } }
var store = {
  get: function (k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v, persistente) { try { (persistente ? localStorage : sessionStorage).setItem(k, v); } catch (e) { } },
  del: function (k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { } }
};

function hora(iso) { return iso ? new Date(iso).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false }) : ''; }
function fecha(iso) { return new Date(iso).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fdia(ymd) { if (!ymd) return '—'; var p = ymd.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function dur(ini, fin) {
  var ms = (fin ? new Date(fin) : new Date()) - new Date(ini);
  var m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60);
  return h ? h + ' h ' + (m % 60) + ' min' : m + ' min';
}
function aLocal(d) { function p(n) { return String(n).padStart(2, '0'); } return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

/* ---------- Comunicación con Apps Script ---------- */
function api(accion, datos) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: S.token, accion: accion, datos: datos || {} }),
    redirect: 'follow'
  }).then(function (resp) { return resp.text(); }, function () {
    throw new Error('No se pudo conectar con el servidor. Revisa tu conexión a internet.');
  }).then(function (txt) {
    var r = jparse(txt, null);
    if (!r) throw new Error('Respuesta inválida del servidor.');
    if (r.ok) return r.data;
    if (r.error === 'SESION') { cerrarLocal(); throw new Error('Tu sesión expiró. Ingresa nuevamente.'); }
    throw new Error(r.error);
  });
}

function render() {

  if (!$('#contenido')) return render();

}
function ir(vista, param) {
  S.vista = vista; S.param = param || null; S.datos = null;
  if (!$('#contenido')) render(); else pintar();
  window.scrollTo(0, 0);
  return cargar();
}
function cargar(silencioso) {
  var v = S.vista, p = S.param, pr;
  if (v === 'inicio') pr = Promise.all([api('inicio'), api('equipos')]).then(function (r) { r[0].equipos = r[1].equipos; return r[0]; });
  else if (v === 'equipos') pr = api('equipos');
  else if (v === 'equipo') pr = api('equipo', { id: p });
  else if (v === 'reservas') pr = api('reservas');
  else if (v === 'encargos') pr = api('encargos', { todos: S.encTab === 'todos' });
  else if (v === 'admin') pr = api('adminDatos');
  else if (v === 'perfil') pr = api('yo');
  else if (v === 'retro') pr = asegurarSug().then(function () { return {}; });
  else pr = Promise.resolve({});
  return pr.then(function (d) {
    if (S.vista !== v || S.param !== p) return;
    S.datos = d;
    if (d && d.config) S.config = d.config;
    if (d && d.mensajes) S.msgs = d.mensajes;
    if (v === 'inicio' && d.avisos && d.avisos.length) {
      d.avisos.forEach(function (a) { S.avisos.push(a); toast(a.texto); });
    }
    if (silencioso) {
      var foco = document.activeElement;
      if (S.modal || (foco && $('#contenido') && $('#contenido').contains(foco) && /INPUT|SELECT|TEXTAREA/.test(foco.tagName))) return;
    }
    pintar();
  }).catch(function (e) {
    if (!silencioso) { toast(e.message, 'error'); if (S.token) pintar(); }
  });
}
function asegurarSug() {
  if (S.sug) return Promise.resolve(S.sug);
  return api('sugerencias').then(function (s) { S.sug = s; return s; });
}

    case 'reservas': return vReservas(d);
    case 'encargos': return vEncargos(d);

var LEYENDA = '<div class="leyenda"><span><i class="sw sw-uso"></i>En uso</span><span><i class="sw sw-res"></i>Reservado</span><span><i class="sw sw-ahora"></i>Ahora</span><span>Ventana de 12 h</span></div>';
function tira(e) {
  var now = Date.now(), a = now - 4 * 36e5, b = now + 8 * 36e5, span = b - a, txt = [];
  var pos = function (t) { return Math.max(0, Math.min(100, (t - a) / span * 100)); };
  var s = '';
  if (e.ocupacion) {
    var i = new Date(e.ocupacion.inicio).getTime();
    s += '<i class="t-uso" style="left:' + pos(i) + '%;width:' + Math.max(.8, pos(now) - pos(i)) + '%"></i>';
    txt.push('En uso desde las ' + hora(e.ocupacion.inicio));
  }
  var r = e.proxima_reserva;
  if (r) {
    var ri = new Date(r.inicio).getTime(), rf = new Date(r.fin).getTime();

  }
  s += '<i class="t-ahora" style="left:' + pos(now) + '%"></i>';
  return '<div class="tira" role="img" aria-label="' + esc(txt.join('. ') || 'Sin uso ni reservas en las próximas 12 horas') + '">' + s + '</div>';
}
function filaEq(e) {

function actualizarSugProd(form) {
  if (!form || !S.sug) return;
  var p = productoPorNombre(form.producto.value);
  var dl = form.querySelector('#dl-ens'), chips = form.querySelector('#chips-lotes');
  if (!p) { if (dl) dl.innerHTML = ''; if (chips) chips.innerHTML = ''; return; }
  var radio = form.querySelector('input[name=area][value="' + p.area + '"]');
  if (radio && !form.querySelector('input[name=area]:checked')) radio.checked = true;
  if (radio && form.dataset.ultProd !== p.id) { radio.checked = true; form.dataset.ultProd = p.id; }
  if (dl) dl.innerHTML = S.sug.ensayos.filter(function (x) { return x.producto_id === p.id; }).map(function (x) { return '<option value="' + esc(x.nombre) + '">'; }).join('');
  if (chips) chips.innerHTML = S.sug.lotes.filter(function (x) { return x.producto_id === p.id; }).slice(-8).reverse().map(function (x) { return '<button type="button" class="chip" data-a="agregarLote" data-l="' + esc(x.codigo) + '">+ ' + esc(x.codigo) + '</button>'; }).join('');

  filtrarIr: function (ds) { S.filtroEq = ds.t; ir('equipos'); },
  filtroEq: function (ds) { S.filtroEq = ds.t; pintar(); },
  menuMas: function () {
    var items = navItems().filter(function (i) { return ['inicio', 'equipos', 'reservas', 'encargos'].indexOf(i[0]) < 0; });
    modal('<h2>Más</h2><div class="lista">' + items.map(function (i) { return '<button class="fila click" data-a="ir" data-v="' + i[0] + '">' + i[2].replace('<svg', '<svg width="22" height="22"') + '<span class="crece">' + i[1] + '</span></button>'; }).join('') + '</div><div class="acciones"><button class="btn sec" data-a="cerrarModal">Cerrar</button></div>');
  },
  cerrarModal: function () { if (S._res) { var r = S._res; S._res = null; r(null); } cerrarModal(); },
  resSi: function () { var r = S._res; S._res = null; cerrarModal(); if (r) r(true); },
  resNo: function () { var r = S._res; S._res = null; cerrarModal(); if (r) r(null); },
  salir: function () {
    var t = S.token;
    if (t) api('logout').catch(function () { });
    cerrarLocal();
  },
  cerrarAviso: function (ds) { S.avisos.splice(Number(ds.i), 1); pintar(); },
  ocupar: function (ds) {
    asegurarSug().then(function () {
      return ds.tipo === 'HPLC' ? mensajeInformativo('ANTES_USO') : true;
    }).then(function (ok) { if (ok) formOcupar(ds); }).catch(function (e) { toast(e.message, 'error'); });
  },
  usarReciente: function (ds, el) {
    var f = el.closest('form');
    f.producto.value = ds.p;
    var r = f.querySelector('input[name=area][value="' + ds.area + '"]');
    if (r) r.checked = true;
    actualizarSugProd(f);
  },
  agregarLote: function (ds, el) {
    var inp = el.closest('form').lotes;
    var arr = inp.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (arr.indexOf(ds.l) < 0) arr.push(ds.l);
    inp.value = arr.join(', ');
  },
  finalizar: function (ds) {
    var propia = ds.uid === S.usuario.id;
    var paso;
    if (!propia) paso = pedirMotivoLiberacion(ds);
    else if (ds.tipo === 'HPLC') paso = mensajeInformativo('FIN_USO', '¿Finalizar el uso de ' + ds.codigo + '?');
    else paso = confirmar('¿Finalizar el uso de ' + ds.codigo + '?', 'Finalizar uso', 'Finalizar uso');
    paso.then(function (r) {
      if (!r) return;
      var motivo = typeof r === 'string' ? r : '';
      return api('finalizarOcupacion', { ocupacion_id: ds.oid, motivo: motivo, mensaje: propia ? (ds.tipo === 'HPLC' ? 'FIN_USO' : '') : 'LIBERAR_TERCERO' })
        .then(function () { toast(ds.codigo + ' liberado.'); cargar(); });
    }).catch(function (e) { toast(e.message, 'error'); cargar(); });
  },
  nuevaReserva: function (ds) { asegurarSug().then(function () { formReserva(ds.id); }).catch(function (e) { toast(e.message, 'error'); }); },
  cancelarReserva: function (ds) {
    confirmar('¿Cancelar esta reserva?', 'Cancelar reserva', 'Cancelar reserva', true).then(function (ok) {
      if (!ok) return;
      return api('cancelarReserva', { id: ds.id }).then(function () { toast('Reserva cancelada.'); cargar(); });
    }).catch(function (e) { toast(e.message, 'error'); });
  },
  reportar: function (ds) {
    modal('<h2>Reportar ' + esc(ds.codigo) + ' como no operativo</h2><form data-f="reportar"><input type="hidden" name="equipo_id" value="' + ds.id + '">' +
      '<label>Descripción breve del problema<textarea name="descripcion" required maxlength="500" autofocus></textarea></label>' +
      '<p class="sub">Se registrará tu nombre, fecha y hora. Solo usuarios autorizados pueden devolverlo a disponible.</p>' +
      '<div class="acciones"><button type="button" class="btn sec" data-a="cerrarModal">Cancelar</button><button class="btn peligro">Reportar</button></div></form>');
  },
  restaurar: function (ds) {
    modal('<h2>Marcar ' + esc(ds.codigo) + ' como operativo</h2><form data-f="restaurar"><input type="hidden" name="equipo_id" value="' + ds.id + '">' +
      '<label>Nota de resolución <span class="sub">(opcional)</span><textarea name="nota" maxlength="500"></textarea></label>' +
      '<div class="acciones"><button type="button" class="btn sec" data-a="cerrarModal">Cancelar</button><button class="btn">Marcar operativo</button></div></form>');
  },
  retroAgregar: function () { S.retro.push(filaRetroVacia(S.retro[S.retro.length - 1])); pintar(); },
  retroQuitar: function (ds) { S.retro.splice(Number(ds.r), 1); pintar(); },
  retroGuardar: function (ds, el) {
    var filas = S.retro.map(function (f) { return { equipo_id: f.equipo_id, producto: f.producto, area: f.area, lotes: f.lotes, ensayo: f.ensayo, inicio: deLocal(f.inicio), fin: deLocal(f.fin) }; });
    var enviar = function (forzar) {
      el.disabled = true;
      return api('registroRetrospectivo', { filas: filas, forzar: forzar }).then(function (r) {
        el.disabled = false;
        if (r.requiereConfirmacion) {
          return confirmar('Se detectaron posibles cruces de horario:\n\n' + r.advertencias.join('\n') + '\n\n¿Guardar de todas formas?', 'Guardar igual', 'Revisar cruces').then(function (ok) { if (ok) return enviar(true); });
        }
        toast(r.creados + ' registro(s) guardado(s).');
        S.retro = [filaRetroVacia()]; S.sug = null;
        asegurarSug().then(pintar);
      });
    };
    enviar(false).catch(function (e) { el.disabled = false; toast(e.message, 'error'); });
  },
  nuevoEncargo: function () {
    S._qEnc = ''; S.usuariosEnc = null;
    modal('<h2>Dejar encargo</h2>' + cargandoHtml());
    api('usuariosLista').then(function (l) { S.usuariosEnc = l; if (S.modal) modal(modalEncargo()); }).catch(function (e) { cerrarModal(); toast(e.message, 'error'); });
  },
  encElegir: function (ds) {
    S.encDest = ds;
    modal('<h2>Dejar encargo a ' + esc(ds.nombre) + '</h2><p>' + (ds.turno === '1' ? esc(ds.nombre) + ' está en turno y verá el aviso al abrir LabControl.' : esc(ds.nombre) + ' está fuera de turno: verá el aviso cuando comience su próxima jornada.') + '</p>' +
      '<p class="sub">Envía el detalle por WhatsApp. LabControl solo registra que tiene un encargo pendiente.</p>' +
      '<div class="acciones"><button class="btn sec" data-a="nuevoEncargo">Volver</button><button class="btn" data-a="encCrear" autofocus>Registrar encargo</button></div>');
  },
  encCrear: function (ds, el) {
    el.disabled = true;
    api('crearEncargo', { para_usuario_id: S.encDest.id }).then(function (r) {
      cerrarModal();
      toast('Encargo registrado para ' + r.destinatario + '.');
      if (S.vista === 'encargos' || S.vista === 'inicio') cargar();
    }).catch(function (e) { el.disabled = false; toast(e.message, 'error'); });
  },
  confirmarEnc: function (ds, el) {
    el.disabled = true;
    api('confirmarEncargo', { id: ds.id }).then(function () {
      toast('Revisión confirmada.');
      S.avisos = S.avisos.filter(function (a) { return a.ref_id !== ds.id; });
      cargar();
    }).catch(function (e) { el.disabled = false; toast(e.message, 'error'); });
  },
  encTab: function (ds) { S.encTab = ds.t; S.datos = null; pintar(); cargar(); },
  adminTab: function (ds) { S.adminTab = ds.t; pintar(); },
  formUsuario: function (ds) { formUsuario(ds.id); },
  formClave: function (ds) {
    var u = S.datos.usuarios.find(function (x) { return x.id === ds.id; });
    modal('<h2>Restablecer clave</h2><p>' + esc(u.nombre) + ' deberá cambiarla al ingresar. Sus sesiones abiertas se cerrarán.</p><form data-f="clave"><input type="hidden" name="id" value="' + u.id + '">' +
      '<label>Clave temporal (mínimo 8 caracteres)<input name="clave" minlength="8" required autofocus></label>' +
      '<div class="acciones"><button type="button" class="btn sec" data-a="cerrarModal">Cancelar</button><button class="btn">Restablecer</button></div></form>');
  },
  formTurno: function (ds) { formTurno(ds.id); },
  formAsignar: function () { formAsignar(); },
  formAusencia: function () { formAusencia(); },
  formEquipo: function (ds) { formEquipo(ds.id); },
  quitarAsignacion: function (ds) {
    confirmar('¿Quitar esta asignación de turno? Si ya comenzó, se cerrará con fecha de ayer.', 'Quitar', 'Quitar asignación', true).then(function (ok) {
      if (ok) return api('quitarAsignacion', { id: ds.id }).then(function () { toast('Asignación actualizada.'); cargar(); });
    }).catch(function (e) { toast(e.message, 'error'); });
  },
  quitarAusencia: function (ds) {
    confirmar('¿Eliminar esta ausencia?', 'Eliminar', 'Eliminar ausencia', true).then(function (ok) {
      if (ok) return api('quitarAusencia', { id: ds.id }).then(function () { toast('Ausencia eliminada.'); cargar(); });
    }).catch(function (e) { toast(e.message, 'error'); });
  },
  regenerarTv: function () {
    confirmar('El enlace actual del televisor dejará de funcionar.', 'Regenerar', 'Regenerar enlace').then(function (ok) {
      if (ok) return api('regenerarTv').then(function () { toast('Enlace regenerado.'); cargar(); });
    }).catch(function (e) { toast(e.message, 'error'); });
  },
  prefEmail: function (ds, el) {
    api('preferencias', { notif_email: el.checked }).then(function (u) { S.usuario = u; toast('Preferencia guardada.'); }).catch(function (e) { el.checked = !el.checked; toast(e.message, 'error'); });
  }
};

function fdatos(f) {
  var o = {};
  new FormData(f).forEach(function (v, k) {
    if (o[k] !== undefined) { if (!Array.isArray(o[k])) o[k] = [o[k]]; o[k].push(v); } else o[k] = v;
  });
  return o;
}
function lista(v) { return v === undefined ? [] : (Array.isArray(v) ? v : [v]); }

var FORM = {
  login: function (d) {
    return api('login', { email: d.email, clave: d.clave }).then(function (r) {
      S.token = r.token; S.usuario = r.usuario;
      store.set('lc_token', r.token, !!d.recordar);
      store.set('lc_recordar', d.recordar ? '1' : '', true);
      return cargarYo();
    }).then(function () { if (S.usuario.debe_cambiar_clave) render(); else { render(); ir('inicio'); } });
  },
  cambioClave: function (d) {
    if (d.nueva !== d.repetir) throw new Error('Las claves nuevas no coinciden.');
    return api('cambiarClave', { actual: d.actual, nueva: d.nueva }).then(function (r) {
      S.token = r.token; S.usuario = r.usuario;
      store.set('lc_token', r.token, store.get('lc_recordar') === '1');
      toast('Clave actualizada.');
      render(); return ir(S.vista === 'perfil' ? 'perfil' : 'inicio');
    });
  },
  liberar: function (d) {
    var r = S._res; S._res = null; cerrarModal();
    if (r) r(String(d.motivo || '').trim() || null);
    return Promise.resolve('silencio');
  },
  ocupar: function (d, f) {
    if (!d.area) throw new Error('Selecciona el área del análisis (MP o PT).');
    var datos = { equipo_id: d.equipo_id, producto: d.producto, area: d.area, lotes: d.lotes, ensayo: d.ensayo, mensaje: d.mensaje };
    store.set('lc_ult', JSON.stringify({ producto: d.producto, area: d.area }), true);
    var enviar = function (forzar) {
      datos.forzar = forzar;
      return api('iniciarOcupacion', datos).then(function (r) {
        if (r && r.requiereConfirmacion) {
          return confirmar(r.advertencia, 'Ocupar igual', 'Reserva cercana').then(function (ok) { return ok ? enviar(true) : 'silencio'; });
        }
        cerrarModal(); toast('Equipo ocupado.'); S.sug = null; cargar(); return 'silencio';
      });
    };
    return enviar(false);
  },
  reservar: function (d) {
    return api('reservar', { equipo_id: d.equipo_id, inicio: deLocal(d.inicio), fin: deLocal(d.fin), producto: d.producto, ensayo: d.ensayo, nota: d.nota }).then(function () { return 'Reserva registrada.'; });
  },
  reportar: function (d) { return api('reportarIncidencia', d).then(function () { return 'Equipo reportado como no operativo.'; }); },
  restaurar: function (d) { return api('resolverIncidencia', d).then(function () { return 'Equipo disponible nuevamente.'; }); },
  usuario: function (d) {
    return api('guardarUsuario', { id: d.id || '', nombre: d.nombre, email: d.email, area_habitual: d.area_habitual, roles: lista(d.roles), activo: !!d.activo, clave_temporal: d.clave_temporal }).then(function () { return 'Usuario guardado.'; });
  },
  clave: function (d) { return api('restablecerClave', d).then(function () { return 'Clave restablecida.'; }); },
  turno: function (d) {
    return api('guardarTurno', { id: d.id || '', nombre: d.nombre, tipo: d.tipo, hora_inicio: d.hora_inicio, hora_fin: d.hora_fin, dias: lista(d.dias), activo: !!d.activo }).then(function () { return 'Turno guardado.'; });
  },
  asignar: function (d) { return api('asignarTurno', d).then(function () { return 'Turno asignado.'; }); },
  ausencia: function (d) { return api('guardarAusencia', d).then(function () { return 'Ausencia registrada.'; }); },
  equipo: function (d) {
    var carac = {};
    String(d.caracteristicas || '').split('\n').forEach(function (l) {
      var i = l.indexOf(':');
      if (i > 0) { var k = l.slice(0, i).trim(), v = l.slice(i + 1).trim(); if (k) carac[k] = v; }
      else if (l.trim()) carac[l.trim()] = '';
    });
    return api('guardarEquipo', { id: d.id || '', codigo: d.codigo, nombre: d.nombre, tipo: d.tipo, marca: d.marca, modelo: d.modelo, area_uso: d.area_uso, caracteristicas: carac, activo: !!d.activo })
      .then(function () { S.sug = null; return 'Equipo guardado.'; });
  },
  mensaje: function (d) { return api('guardarMensaje', { clave: d.clave, titulo: d.titulo, texto: d.texto, boton: d.boton, activo: !!d.activo }).then(function () { return cargarYo().then(function () { return 'Mensaje guardado.'; }); }); },
  config: function (d) {
    return api('guardarConfig', {
      nombre_laboratorio: d.nombre_laboratorio, zona_horaria: d.zona_horaria, url_frontend: d.url_frontend, segundos_refresco: d.segundos_refresco,
      roles_liberar_tercero: lista(d.roles_liberar_tercero).join(','), roles_restaurar_equipo: lista(d.roles_restaurar_equipo).join(','),
      notif_email_activo: d.notif_email_activo
    }).then(function () { return cargarYo().then(function () { return 'Configuración guardada.'; }); });
  }
};

document.addEventListener('click', function (ev) {
  if (ev.target.dataset && ev.target.dataset.fondo) { ACC.cerrarModal(); return; }
  var el = ev.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  var fn = ACC[el.dataset.a];
  if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el.dataset, el, ev); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.tagName === 'INPUT' && el.dataset.a && ACC[el.dataset.a]) ACC[el.dataset.a](el.dataset, el, ev);
  if (el.dataset.r !== undefined && el.dataset.k && S.retro) actualizarFilaRetro(el);
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset.prod) actualizarSugProd(el.form);
  if (el.dataset.r !== undefined && el.dataset.k && S.retro) actualizarFilaRetro(el);
  if (el.dataset.busca === 'eq') {
    S.buscaEq = el.value;
    var pos = el.selectionStart;
    pintar();
    var n = document.querySelector('[data-busca="eq"]');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
  }
  if (el.dataset.busca === 'enc') {
    S._qEnc = el.value;
    var q = norm(el.value);
    $('#lista-enc').innerHTML = listaEncHtml((S.usuariosEnc || []).filter(function (u) { return !q || norm(u.nombre).indexOf(q) >= 0; }));
  }
});
document.addEventListener('focusin', function (ev) { if (ev.target.dataset && ev.target.dataset.sel) ev.target.select(); });
function actualizarFilaRetro(el) {
  var f = S.retro[Number(el.dataset.r)];
  if (!f) return;
  f[el.dataset.k] = el.value;
  if (el.dataset.k === 'producto') {
    var p = productoPorNombre(el.value);
    if (p && !f.area) {
      f.area = p.area;
      var sel = document.querySelector('select[data-r="' + el.dataset.r + '"][data-k="area"]');
      if (sel) sel.value = p.area;
    }
  }
}
document.addEventListener('submit', function (ev) {
  var f = ev.target, nombre = f.dataset.f;
  if (!nombre || !FORM[nombre]) return;
  ev.preventDefault();
  var btn = f.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  var p;
  try { p = Promise.resolve(FORM[nombre](fdatos(f), f)); } catch (e) { p = Promise.reject(e); }
  p.then(function (msg) {
    if (btn) btn.disabled = false;
    if (msg === 'silencio' || msg === undefined) return;
    cerrarModal(); toast(msg); cargar();
  }).catch(function (e) { if (btn) btn.disabled = false; toast(e.message, 'error'); });
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.modal) ACC.cerrarModal(); });

/* ---------- Sesión ---------- */
function cargarYo() {
  return api('yo').then(function (d) {
    S.usuario = d.usuario; S.config = d.config; S.msgs = d.mensajes; S.notifEmail = d.notif_email_activo;
    return d;
  });
}
function cerrarLocal() {
  S.token = null; S.usuario = null; S.datos = null; S.sug = null; S.avisos = []; S.retro = null;
  store.del('lc_token');
  cerrarModal(); render();
}
function iniciarPolling() {
  if (S._poll) return;
  S._poll = setInterval(function () {
    if (!S.token || !S.usuario || S.usuario.debe_cambiar_clave || document.hidden || S.modal) return;
    if (['inicio', 'equipos', 'equipo', 'reservas', 'encargos'].indexOf(S.vista) < 0) return;
    cargar(true);
  }, Math.max(10, (S.config && S.config.segundos_refresco) || 20) * 1000);
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.token && S.usuario && !S.modal && ['inicio', 'equipos', 'equipo', 'reservas', 'encargos'].indexOf(S.vista) >= 0) cargar(true);
});

/* ---------- Modo televisor ---------- */
function pintarTV(d) {
  var reloj = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (!d) { $('#app').innerHTML = '<div class="tv-error">Cargando panel…</div>'; return; }
  var tile = function (e) {
    var col = EST[e.estado][0];
    var det = e.estado === 'OCUPADO' ? (e.area ? e.area + ' · ' : '') + (e.ensayo ? esc(e.ensayo) + ' · ' : '') + dur(e.inicio)
      : e.estado === 'DISPONIBLE' && e.proxima ? 'Reservado desde ' + hora(e.proxima) : '';
    return '<div class="tv-eq ' + col + '"><div class="c">' + esc(e.codigo) + '</div><div class="e">' + EST[e.estado][1] + '</div><div class="d">' + det + '</div></div>';
  };
  var r = d.resumen;
  var hplc = d.equipos.filter(function (e) { return e.tipo === 'HPLC'; }), dis = d.equipos.filter(function (e) { return e.tipo === 'DISOLUTOR'; });
  $('#app').innerHTML = '<div class="tv"><div class="tv-cab"><h1>' + esc(d.laboratorio || 'LabControl') + '</h1><div class="tv-reloj" id="tv-reloj">' + reloj + '</div></div>' +
    '<div class="tv-res"><div>HPLC disponibles<b>' + r.HPLC.DISPONIBLE + ' / ' + hplc.length + '</b></div><div>Disolutores disponibles<b>' + r.DISOLUTOR.DISPONIBLE + ' / ' + dis.length + '</b></div>' +
    '<div>No operativos<b>' + (r.HPLC.NO_OPERATIVO + r.DISOLUTOR.NO_OPERATIVO) + '</b></div><div>Usos activos MP<b>' + d.actividades.MP + '</b></div><div>Usos activos PT<b>' + d.actividades.PT + '</b></div></div>' +
    (hplc.length ? '<h2>HPLC</h2><div class="tv-grid">' + hplc.map(tile).join('') + '</div>' : '') +
    (dis.length ? '<h2>Disolutores</h2><div class="tv-grid">' + dis.map(tile).join('') + '</div>' : '') + '</div>';
}
function iniciarTV() {
  document.body.classList.add('modo-tv');
  pintarTV(null);
  var tick = function () {
    api('tvEstado', { tv: TV_TOKEN }).then(function (d) { pintarTV(d); setTimeout(tick, (d.segundos || 20) * 1000); })
      .catch(function (e) { $('#app').innerHTML = '<div class="tv-error">' + esc(e.message) + '</div>'; setTimeout(tick, 60000); });
  };
  tick();
  setInterval(function () { var c = $('#tv-reloj'); if (c) c.textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false }); }, 10000);
}

/* ---------- Arranque ---------- */
function boot() {
  if (MODO === 'tv') { iniciarTV(); return; }
  S.token = store.get('lc_token');
  if (!S.token) { render(); return; }
  $('#app').innerHTML = cargandoHtml();
  cargarYo().then(function () {
    render();
    iniciarPolling();
    if (!S.usuario.debe_cambiar_clave) ir('inicio');
  }).catch(function () { cerrarLocal(); });
}
boot();
</script>
