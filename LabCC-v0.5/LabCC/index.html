<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabControl</title>
<meta name="theme-color" content="#A31968">
<meta name="description" content="LabControl: equipos, verificaciones diarias, turnos y encargos del laboratorio de control de calidad.">
<link rel="icon" href="favicon.svg?v=6" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=6" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=6">
<link rel="manifest" href="manifest.webmanifest?v=6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LabControl">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --ground:#f7f8fa;--surface:#fff;--raised:#eceef2;--border:#e1e5ea;--rule:#eef0f3;--control:#cfd5dc;
  --text:#0f1419;--muted:#5b6572;--faint:#6b7480;--primary:#A31968;
  --hue:#A31968;--hue-s:#FCEBF3;--rosa:#D64B91;--rosa-m:#F4B6D2;--rosa-p:#FCEBF3;--mag-ink:#7a1150;--tinta:#1d1a1f;
  --ok:#247b50;--ok-bg:#dcfae5;--ok-ink:#04250e;
  --bad:#c4242a;--bad-bg:#ffedea;--bad-ink:#831c1e;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-ink:#92400e;--warn-line:#fde68a;
  --neu-bg:#eceef2;--neu-ink:#3d4650;
  --r-card:8px;--r-ctl:6px;--gap:12px;--pad:24px;--h-ctl:36px;
  --ease:cubic-bezier(.23,1,.32,1);
  --font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--ground);color:var(--text);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:16px;line-height:22px;font-weight:600;margin:0}
h3{font-size:13px;line-height:18px;font-weight:600;color:var(--muted);margin:0 0 8px}
p{margin:0 0 8px}
a{color:var(--hue)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.sub{color:var(--muted);font-size:13px;line-height:18px}
.muted{color:var(--muted)}
.pre{white-space:pre-line}
.mono,.eq-cod,.mono-s{font-family:var(--mono)}
.mono-s{font-size:12px;color:var(--muted)}
.num,.kpi-v,.cuenta{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hue);outline-offset:2px}

/* ===== Estructura ===== */
.layout{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;padding:20px 16px 96px;max-width:1240px;margin:0 auto;width:100%}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;background:none;border:0;min-height:56px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;line-height:14px;color:var(--muted);transition:color 120ms ease}
.bottom button.act{color:var(--text);font-weight:600}
.bottom button:active{transform:scale(.96)}
.bottom svg,.nav-item svg{width:20px;height:20px;flex-shrink:0}
.marca{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.marca-svg{width:28px;height:28px;flex-shrink:0;display:block}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;width:260px;flex-shrink:0;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;padding:20px 12px 14px;overflow-y:auto}
  .side .marca{padding:0 8px 16px}
  .ambito{margin:0 0 4px;padding:9px 10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-ctl);line-height:17px}
  .ambito b{display:block;font-size:13px;font-weight:600}
  .ambito small{color:var(--muted);font-size:12px}
  .nav-grupo{margin-top:22px}
  .nav-tit{font-size:12px;color:var(--muted);padding:0 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;height:32px;margin-bottom:2px;padding:0 10px;background:none;border:0;border-radius:var(--r-ctl);text-align:left;color:var(--muted);transition:background-color 120ms ease,color 120ms ease}
  .nav-item svg{width:16px;height:16px}
  .nav-item.act{background:#e5e8ed;color:var(--text);font-weight:500}
  .nav-item.salir{margin-top:2px;color:var(--muted)}
  .user-row{margin-top:auto;display:flex;align-items:center;gap:10px;width:100%;padding:8px;background:none;border:0;border-radius:var(--r-ctl);text-align:left;transition:background-color 120ms ease}
  .user-row b{display:block;font-size:13px;font-weight:500;line-height:17px}
  .user-row small{display:block;color:var(--muted);font-size:12px;line-height:16px}
  .user-row.act{background:#e5e8ed}
  .bottom{display:none}
  main{padding:32px 40px 56px}
}
@media(hover:hover) and (pointer:fine){
  .nav-item:hover,.user-row:hover{background:#e9ecf0}
  .nav-item.act:hover{background:#e5e8ed}
}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.cab .linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 0}
.seccion{margin:28px 0 8px}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid2{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dos{display:grid;gap:20px;align-items:start}
@media(min-width:1100px){.dos.con-aside{grid-template-columns:minmax(0,1fr) 320px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px}
.vacio{padding:14px 16px;text-align:center;color:var(--muted);background:transparent;border:1px dashed var(--control);border-radius:var(--r-card);font-size:13px}

/* ===== Estados y etiquetas ===== */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;line-height:1;font-weight:500;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.verde{background:var(--ok-bg);color:var(--ok-ink)}.verde i{background:var(--ok)}
.rojo{background:var(--bad-bg);color:var(--bad-ink)}.rojo i{background:var(--bad)}
.amarillo{background:var(--warn-bg);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-line)}.amarillo i{background:var(--warn)}
.gris{background:var(--neu-bg);color:var(--neu-ink)}
.info{background:var(--hue-s);color:var(--mag-ink)}
.hecho{background:var(--neu-bg);color:var(--text)}
.azul{background:var(--neu-bg);color:var(--neu-ink)}
.alerta{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:var(--r-ctl);padding:8px 10px;font-size:13px;line-height:18px;margin-top:6px}
.alerta.roja{background:var(--bad-bg);border-color:#f7c9c4;color:var(--bad-ink)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:600;flex-shrink:0;line-height:1}
.av.g{width:28px;height:28px;font-size:12px}

/* ===== Avisos y KPIs ===== */
.aviso{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--control);border-radius:var(--r-card);padding:10px 12px;margin-bottom:12px}
.aviso svg{width:18px;height:18px;flex-shrink:0}
.aviso span{flex:1}
.aviso button{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:var(--r-ctl)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--rule);border-top:1px solid var(--rule);text-align:left;background:none;border-right:0;border-bottom:0;display:block;width:100%}
.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(odd){border-left:0}
.kpi:last-child:nth-child(odd){grid-column:1/-1}
.kpi-l{display:block;color:var(--muted);font-size:13px;line-height:18px}
.kpi-v{display:block;font-size:28px;line-height:36px;font-weight:500;letter-spacing:-.02em;margin:2px 0}
.kpi-v small{font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}
.kpi-s{display:block;color:var(--muted);font-size:12px;line-height:16px}
@media(min-width:760px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{border-top:0}.kpi:nth-child(odd){border-left:1px solid var(--rule)}.kpi:first-child{border-left:0}
  .kpi:last-child:nth-child(odd){grid-column:auto}
}
@media(hover:hover) and (pointer:fine){button.kpi:hover{background:#fafbfc}}

/* ===== Tablero de equipos ===== */
.tablero{container-type:inline-size;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:16px}
.tablero-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.cuenta{color:var(--muted);font-weight:400;margin-left:4px}
.leyenda{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:8px;border-radius:2px}
.sw-uso{background:var(--warn)}
.sw-res{background:var(--hue-s);box-shadow:inset 0 0 0 1px var(--hue)}
.sw-ahora{width:2px;height:12px;background:var(--text);border-radius:0}
.eq-fila{display:grid;gap:8px 16px;padding:14px 16px;border-bottom:1px solid var(--rule);align-items:start;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id est" "uso uso" "tira tira" "acc acc"}
.eq-fila:last-child{border-bottom:0}
.eq-id{grid-area:id;display:flex;gap:10px;align-items:flex-start;min-width:0}
.eq-est{grid-area:est;justify-self:end}
.eq-uso{grid-area:uso;min-width:0}
.eq-tira{grid-area:tira}
.eq-acc{grid-area:acc;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.eq-acc:empty{display:none}
.pt{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--control)}
.pt-verde{background:var(--ok)}.pt-rojo{background:var(--bad)}.pt-amarillo{background:var(--warn)}
.eq-cod{background:none;border:0;padding:0;font-size:14px;line-height:20px;font-weight:500;color:var(--text);text-align:left}
.eq-cod:hover{text-decoration:underline;text-underline-offset:3px}
.eq-quien{display:flex;align-items:center;gap:8px;line-height:20px}
.eq-quien b{font-weight:500}
.tira{position:relative;height:20px;border-radius:3px;background:var(--rule)}
.tira i{position:absolute;top:0;bottom:0;display:block;font-style:normal}
.t-uso{background:var(--warn);border-radius:2px}
.t-res{background:var(--hue-s);box-shadow:inset 0 0 0 1px var(--hue);border-radius:2px}
.t-ahora{width:2px;margin-left:-1px;background:var(--text)}
@container (min-width:520px){
  .eq-fila{grid-template-columns:minmax(170px,230px) minmax(0,1fr) auto;grid-template-areas:"id uso est" "id tira acc"}
  .eq-est{justify-self:end}
}
@container (min-width:860px){
  .eq-fila{grid-template-columns:200px 118px minmax(0,1fr) 190px 128px;grid-template-areas:"id est uso tira acc";align-items:center}
  .eq-acc{justify-content:flex-end}
  .eq-acc:empty{display:block}
  .eq-est{justify-self:start}
  .pt{margin-top:6px}
}
@container (min-width:520px) and (max-width:859px){.eq-acc{justify-content:flex-end}.eq-fila{align-items:center}.eq-uso{align-self:start}}

/* ===== Listas, tablas, pestañas ===== */
.lista{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.fila:last-child{border-bottom:0}
.fila .crece{flex:1;min-width:0}
.fila b{font-weight:500}
.fila.click{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
@media(hover:hover) and (pointer:fine){.fila.click:hover{background:#fafbfc}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;border:1px solid var(--control);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px;transition:background-color 120ms ease,color 120ms ease}
.chip.act{background:var(--primary);border-color:var(--primary);color:#fff}
.chip:active{transform:scale(.97)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:500}
.tabs button.act{color:var(--text);border-bottom-color:var(--primary)}
dl.ficha{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0}
dl.ficha dt{color:var(--muted)}dl.ficha dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tabla-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}

/* ===== Botones y formularios ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--h-ctl);padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:500;white-space:nowrap;transition:transform 160ms var(--ease),background-color 120ms ease,border-color 120ms ease,opacity 120ms ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--control)}
.btn.ghost{background:none;border-color:transparent;color:var(--text)}
.btn.peligro{background:var(--bad);border-color:var(--bad)}
.btn.chico{height:30px;padding:0 11px;font-size:13px}
.btn.bloque{width:100%}
@media(hover:hover) and (pointer:fine){
  .btn:hover{background:#000}.btn.sec:hover,.btn.ghost:hover{background:#f1f3f6}.btn.peligro:hover{background:#a81e23}
}
label{display:block;font-weight:500;font-size:14px;margin-bottom:14px}
label .sub{font-weight:400}
label input,label select,label textarea{display:block;width:100%;margin-top:6px;font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input[type=time],input[type=search],input[type=number],input:not([type]),select,textarea{border:1px solid var(--control);border-radius:var(--r-ctl);padding:0 12px;background:var(--surface);height:40px;font-size:14px;transition:border-color 120ms ease,box-shadow 120ms ease}
textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--hue);box-shadow:0 0 0 3px rgba(163,25,104,.2)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[readonly]{background:var(--ground)}
@media(max-width:899px){input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input[type=time],input[type=search],input[type=number],input:not([type]),select,textarea{font-size:16px}}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:500;font-size:14px;margin-bottom:6px;padding:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg legend{width:100%}
.seg label{flex:1;min-width:130px;margin:0;font-weight:400;border:1px solid var(--control);border-radius:var(--r-ctl);padding:0 12px;height:40px;display:flex;gap:8px;align-items:center;cursor:pointer;background:var(--surface)}
.seg label:has(input:checked){border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:500}
.seg input{width:auto;height:auto;margin:0;accent-color:var(--primary)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{font-weight:400;display:flex;gap:8px;align-items:center;margin:0;border:1px solid var(--control);border-radius:999px;padding:0 12px;height:32px;background:var(--surface)}
.checks input,.inline-check input{width:auto;height:auto;margin:0;accent-color:var(--primary)}
.inline-check{display:flex;gap:8px;align-items:center;font-weight:400}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.form-grid{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fila-retro .fila-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}

/* ===== Diálogos y avisos ===== */
.modal-fondo{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fondo 160ms ease-out}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:sube 240ms var(--ease)}
.modal h2{font-size:18px;line-height:24px;margin-bottom:12px}
@media(min-width:640px){.modal-fondo{align-items:center}.modal{border-radius:12px;animation-name:entra}}
@keyframes fondo{from{opacity:0}}
@keyframes sube{from{transform:translateY(24px);opacity:.6}}
@keyframes entra{from{transform:scale(.97);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--primary);color:#fff;padding:10px 14px;border-radius:var(--r-ctl);font-size:14px;white-space:pre-line;box-shadow:0 8px 24px rgba(15,20,25,.2);animation:toast 220ms var(--ease)}
.toast.error{background:var(--bad)}
@keyframes toast{from{transform:translateY(8px);opacity:0}}
@media(min-width:900px){#toast{bottom:24px}}
.cargando{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--control);border-top-color:var(--primary);border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.sk{display:block;background:#e6e9ee;border-radius:4px}
.sk-wrap{max-width:100%}
.sk-fila{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--rule)}
.sk-fila:last-child{border-bottom:0}

/* ===== Ingreso ===== */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(100%,400px);padding:28px}
.login .marca{margin-bottom:22px}
.login h1,.login h2{font-size:20px;line-height:26px;margin-bottom:4px}
.login .nota{margin-top:18px;color:var(--muted);font-size:12px;line-height:17px}

/* ===== Modo televisor ===== */
body.modo-tv{background:#0b0f14;color:#e6e9ed;font-size:clamp(14px,1.25vw,30px);line-height:1.35}
.tv{padding:2vw}
.tv-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vw}
.tv-cab h1{font-size:2em;color:#fff;font-weight:600;line-height:1.2}
.tv-reloj{font-size:2.4em;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.tv-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:1vw;margin-bottom:1.6vw}
.tv-res div{background:#111821;border-radius:.5em;padding:.8em 1em;color:#b4bcc6}
.tv-res b{display:block;font-size:2em;color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.tv h2{font-size:1.2em;color:#b4bcc6;font-weight:500;margin:1.2em 0 .6em}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:1vw}
.tv-eq{border-radius:.5em;padding:.8em 1em;background:#111821;border-left:.35em solid #374151}
.tv-eq.verde{border-left-color:#3fc07a}.tv-eq.rojo{border-left-color:#e5566f}.tv-eq.amarillo{border-left-color:#f0b429}
.tv-eq .c{font-size:1.5em;font-weight:500;color:#fff;font-family:var(--mono)}
.tv-eq .e{font-weight:500;font-size:1em;margin:.2em 0}
.tv-eq.verde .e{color:#5fd69a}.tv-eq.rojo .e{color:#ff8097}.tv-eq.amarillo .e{color:#f5c75a}
.tv-eq .d{color:#b4bcc6;font-size:.9em}
.tv-error{display:grid;place-items:center;min-height:100vh;font-size:1.6em;padding:2em;text-align:center}
#sync{position:fixed;top:0;left:0;right:0;height:2px;z-index:70;background:var(--hue);opacity:0;transition:opacity 150ms ease;pointer-events:none}
#sync.on{opacity:.9}
.diag{width:100%;font-size:13px}.diag td,.diag th{padding:6px 8px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}
/* ===== v0.3: iconos, navegación, tarjetas de equipo, verificaciones, inicio ===== */
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--primary);color:#fff;padding:8px 12px;border-radius:var(--r-ctl);transition:top 120ms ease}
.skip:focus{top:8px}
main:focus{outline:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{display:inline-flex;width:18px;height:18px;flex-shrink:0}
.ico svg{width:100%;height:100%;display:block}
.btn .ico{width:16px;height:16px;margin-left:-2px}
.h-ico{display:flex;align-items:center;gap:10px}
.h-ico .ico{width:24px;height:24px;color:var(--muted)}
.cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hue);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.nav-item>span:not(.cnt):not(.sr):not(.cnt-w):not(.ico){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottom button{position:relative}
.bottom .cnt{position:absolute;top:4px;left:calc(50% + 4px);margin:0;min-width:18px;height:18px;line-height:18px;font-size:11px;padding:0 5px;flex:none}
.bottom button>span:not(.cnt):not(.sr):not(.cnt-w):not(.ico){flex:none}
.nav-item .ico,.bottom .ico{width:20px;height:20px}
@media(min-width:900px){.nav-item .ico{width:16px;height:16px}.nav-item.act .ico{color:var(--hue)}}
.bottom button.act .ico{color:var(--hue)}
.marca-svg{border-radius:8px}

/* Estados de equipo: verde disponible · amarillo en uso · rojo no operativo */
.est-verde{--c:var(--ok)}.est-amarillo{--c:var(--warn)}.est-rojo{--c:var(--bad)}
.leyenda-est{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.leyenda-est span{display:inline-flex;align-items:center;gap:6px}
.leyenda-est i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.eqs{display:grid;align-items:start;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(272px,1fr));margin-bottom:20px}
.eqc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);display:flex;flex-direction:column;min-width:0;transition:border-color 140ms ease}
.eqc.sel{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.eqc-cab{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 8px;background:none;border:0;text-align:left;border-radius:var(--r-card) var(--r-card) 0 0}
.eqc-ico{width:44px;height:44px;flex-shrink:0;color:var(--c,var(--control));transition:color 200ms ease}
.eqc-ico svg{width:100%;height:100%;display:block;stroke-width:1.5}
.eqc-id{flex:1;min-width:0}
.eqc-id b{display:block;font-family:var(--mono);font-size:14px;line-height:20px;font-weight:500}
.eqc-id small{display:block;color:var(--muted);font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqc-sel{width:16px;height:16px;color:var(--faint);transition:transform 160ms var(--ease);flex-shrink:0}
.eqc.sel .eqc-sel{transform:rotate(180deg)}
.eqc-cuerpo{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:64px}
.eqc-linea{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eqc-t{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.eqc-quien{display:flex;align-items:center;gap:8px;min-width:0}
.eqc-quien b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqc-nota{color:var(--muted);font-size:12px;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.area{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;white-space:nowrap}
.area .ico{width:14px;height:14px}
.eqc-acc{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--rule);margin-top:auto;flex-wrap:wrap}
.eqc-acc .btn{flex:1;min-width:0}
.eqc-det{padding:12px 14px 14px;border-top:1px solid var(--rule);background:var(--ground);border-radius:0 0 var(--r-card) var(--r-card);display:flex;flex-direction:column;gap:10px}
.eqc-det dl.ficha{gap:4px 14px;font-size:13px}
.eqc-det .acciones{margin:0;justify-content:flex-start}
.eqc.est-amarillo .badge i{animation:pulso 2.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.3}}
.eqc.flash,.fila.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{from{background:var(--hue-s)}}
@media(hover:hover) and (pointer:fine){.eqc:hover{border-color:var(--control)}.eqc.sel:hover{border-color:var(--text)}.eqc-cab:hover .eqc-id b{text-decoration:underline;text-underline-offset:3px}}
.eqi{width:28px;height:28px;color:var(--c,var(--control));flex-shrink:0}.eqi svg{width:100%;height:100%;display:block;stroke-width:1.6}
.kpi-l{display:flex;align-items:center;gap:6px}
.kpi-l .ico{width:16px;height:16px;color:var(--c,var(--muted))}
.fil-est{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Inicio como panel de trabajo */
.rapidos{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tareas{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-bottom:16px;align-items:start}
.tarea{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;min-width:0}
.tarea-cab{display:flex;align-items:center;gap:10px}
.tarea-cab h2{flex:1;font-size:15px}
.tarea-cab .ico{width:20px;height:20px;color:var(--muted)}
.tarea.pend .tarea-cab .ico{color:var(--hue)}
.tarea p{margin:0}
.nums{display:flex;gap:28px;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column}
.nums b{font-size:30px;line-height:36px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nums small{color:var(--muted);font-size:13px;line-height:18px}
.tarea.pend .nums .p b{color:var(--hue)}
.tarea .lista{border-radius:var(--r-ctl)}
.tarea .acciones{margin:0;justify-content:flex-start}

/* Verificaciones diarias */
.fila .ic{width:22px;height:22px;color:var(--muted);flex-shrink:0}
.fila .ic.hecho{color:var(--text);background:none}
.fila .ic svg{width:100%;height:100%;display:block}
.fila .botones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fila.vf{flex-wrap:wrap}
.vacio-g{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:28px 16px;border:1px dashed var(--control);border-radius:var(--r-card);color:var(--muted);font-size:13px}
.vacio-g .ico{width:28px;height:28px;color:var(--faint)}
.vacio-g b{color:var(--text);font-weight:500;font-size:14px}
.vacio-g p{margin:0;max-width:46ch}
.vacio-g .btn{margin-top:8px}
.semana{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.semana b{font-weight:500;min-width:170px;text-align:center}
.tabla-plan th,.tabla-plan td{white-space:nowrap}
.tabla-plan td.nom{white-space:normal;min-width:170px}
.tabla-plan select{height:34px;font-size:13px;min-width:132px;padding:0 8px}
.tabla-plan .sinp select{border-style:dashed;border-color:var(--hue)}
.tabla-plan input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);margin:0}
.tabla-plan td.c{text-align:center}
.celda-est{font-size:12px;color:var(--muted);margin-top:3px}
.barra{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;min-width:90px}
.barra i{display:block;height:100%;background:var(--text);border-radius:4px}
.dia-seg{display:grid;grid-template-columns:minmax(110px,150px) minmax(90px,1fr) auto;gap:8px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.dia-seg:last-child{border-bottom:0}
@media(max-width:560px){.dia-seg{grid-template-columns:1fr auto}.dia-seg .barra{grid-column:1/-1;order:3}}

.cnt-w{display:contents}
.sec-t{margin:22px 0 10px;display:flex;align-items:baseline}
.sec-t:first-child{margin-top:0}
.fila .botones .btn .ico{width:14px;height:14px}
/* Modo televisor: icono + texto + color */
.tv-eq{position:relative}
.tv-eq .ico{position:absolute;top:.7em;right:.8em;width:2.4em;height:2.4em}
.tv-eq .ico svg{stroke-width:1.5}
.tv-eq.verde .ico{color:#5fd69a}.tv-eq.rojo .ico{color:#ff8097}.tv-eq.amarillo .ico{color:#f5c75a}
.tv-leyenda{display:flex;gap:1.6em;margin:0 0 1em;color:#b4bcc6;font-size:.95em}
.tv-leyenda span{display:inline-flex;align-items:center;gap:.5em}
.tv-leyenda i{width:.8em;height:.8em;border-radius:50%;display:inline-block}
/* ===== v0.4: identidad magenta, dashboard, mapas, análisis y planificador ===== */
body{background:var(--ground)}
.info{background:var(--rosa-p);color:var(--mag-ink)}
.toast{background:var(--tinta)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:#8a1458}.btn.sec:hover,.btn.ghost:hover{background:var(--rosa-p)}}
.btn{box-shadow:0 1px 0 rgba(122,17,80,.18)}
.btn.sec,.btn.ghost{box-shadow:none}
.chip.act{background:var(--hue);border-color:var(--hue)}
.tabs button.act{color:var(--mag-ink);border-bottom-color:var(--hue)}
.bar-marca{display:none}
@media(min-width:900px){.nav-item.act,.user-row.act,.nav-item.act:hover{background:var(--rosa-p)}.nav-item.act{color:var(--mag-ink)}}
.barra i{background:var(--hue)}
.eqc.sel{border-color:var(--hue);box-shadow:inset 0 0 0 1px var(--hue)}
@media(hover:hover) and (pointer:fine){.eqc.sel:hover{border-color:var(--hue)}}

/* Contraseña con ojo */
.pw{position:relative;display:block;margin-top:6px}
.pw input{margin-top:0!important;padding-right:46px}
.pw-ojo{position:absolute;right:3px;top:3px;width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:var(--r-ctl);color:var(--muted);transition:color 120ms ease,background-color 120ms ease}
.pw-ojo .ico{width:19px;height:19px}
.pw-ojo[aria-pressed=true]{color:var(--hue)}
@media(hover:hover) and (pointer:fine){.pw-ojo:hover{background:var(--rosa-p);color:var(--hue)}}
.login{background:linear-gradient(180deg,var(--rosa-p),var(--ground) 55%)}

/* Dashboard principal: tres accesos en triángulo */
.trio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:880px;margin:8px auto 28px}
.trio-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:26px 16px 22px;min-height:196px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 1px 2px rgba(122,17,80,.05);transition:transform 200ms var(--ease),box-shadow 200ms var(--ease),border-color 160ms ease}
.t-oc{grid-column:2/4}.t-mp{grid-column:1/3}.t-pt{grid-column:3/5}
.trio-ico{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--rosa-p);color:var(--hue);transition:background-color 200ms ease,color 200ms ease,transform 240ms var(--ease)}
.trio-ico .ico{width:46px;height:46px}.trio-ico svg{stroke-width:1.4}
.trio-c b{font-size:17px;line-height:22px;letter-spacing:.06em;font-weight:600;color:var(--tinta)}
.trio-c small{display:block;color:var(--muted);font-size:13px;line-height:18px;max-width:30ch}
.trio-c .trio-go{display:inline-flex;align-items:center;gap:4px;color:var(--hue);font-size:13px;font-weight:500;margin-top:2px}
.trio-c .trio-go .ico{width:14px;height:14px;transition:transform 200ms var(--ease)}
@media(hover:hover) and (pointer:fine){
  .trio-c:hover{transform:translateY(-3px);border-color:var(--rosa-m);box-shadow:0 14px 34px rgba(163,25,104,.14)}
  .trio-c:hover .trio-ico{background:var(--hue);color:#fff;transform:scale(1.05)}
  .trio-c:hover .trio-go .ico{transform:translateX(3px)}
}
.trio-c:active{transform:scale(.98)}
.trio-c:focus-visible{outline:3px solid var(--rosa-m);outline-offset:2px}
@media(max-width:560px){.trio{grid-template-columns:1fr 1fr;gap:12px}.t-oc{grid-column:1/-1}.t-mp,.t-pt{grid-column:auto}.trio-c{min-height:168px;padding:18px 10px 16px}.trio-ico{width:68px;height:68px}.trio-ico .ico{width:38px;height:38px}.trio-c b{font-size:14px}.t-oc{min-height:150px}}
@media(max-width:360px){.trio{grid-template-columns:1fr}.t-oc,.t-mp,.t-pt{grid-column:auto}}
.est-res{display:flex;gap:10px 14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.est-res span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.est-res i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}

/* Ocupancia */
.ocup-g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:16px}
.ocup-c{display:flex;gap:16px;align-items:center;text-align:left;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;transition:transform 200ms var(--ease),box-shadow 200ms var(--ease),border-color 160ms ease}
.ocup-c .trio-ico{width:72px;height:72px;flex-shrink:0}.ocup-c .trio-ico .ico{width:40px;height:40px}
.ocup-c h2{font-size:17px;line-height:22px;margin-bottom:6px}
.ocup-c .est-res{justify-content:flex-start;margin-top:4px}
.ocup-plan{grid-column:1/-1;background:linear-gradient(100deg,var(--rosa-p),var(--surface) 70%);border-color:var(--rosa-m)}
.ocup-plan .trio-ico{background:var(--hue);color:#fff}
.ocup-plan .cnt{position:static;margin:0 0 0 8px;display:inline-block}
@media(hover:hover) and (pointer:fine){.ocup-c:hover{transform:translateY(-2px);border-color:var(--rosa-m);box-shadow:0 12px 28px rgba(163,25,104,.12)}.ocup-c:hover .trio-ico{background:var(--hue);color:#fff}}
.ocup-c:active{transform:scale(.99)}
.ocup-c .trio-go{display:inline-flex;align-items:center;gap:4px;color:var(--hue);font-size:13px;font-weight:500;margin-top:6px}
.ocup-c .trio-go .ico{width:14px;height:14px}

/* Mapas de equipos */
.mapa{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 12px 8px;margin-bottom:16px;overflow:hidden}
.mfila{display:grid;align-items:stretch}
.mapa-hplc .mfila{grid-template-columns:repeat(21,minmax(0,1fr))}
.mapa-hplc .f1 .nodo{grid-column:span 3}
.mapa-hplc .f2 .nodo:nth-child(1){grid-column:7/span 3}.mapa-hplc .f2 .nodo:nth-child(2){grid-column:11/span 3}.mapa-hplc .f2 .nodo:nth-child(3){grid-column:15/span 3}.mapa-hplc .f2 .nodo:nth-child(4){grid-column:19/span 3}
.mapa-dis .mfila{grid-template-columns:repeat(4,minmax(0,1fr));max-width:680px;margin:0 auto}
.nodo{display:flex;flex-direction:column;align-items:center;gap:3px;margin:0 3px 12px;padding:10px 2px 8px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c,var(--control));border-radius:12px;text-align:center;min-width:0;transition:transform 180ms var(--ease),box-shadow 180ms var(--ease),border-color 140ms ease}
.nodo-ico{width:clamp(30px,6.4vw,58px);height:clamp(30px,6.4vw,58px);color:var(--c,var(--control));transition:color 220ms ease}
.mapa-dis .nodo-ico{width:clamp(44px,12vw,84px);height:clamp(44px,12vw,84px)}
.nodo-ico svg{width:100%;height:100%;display:block}
.nodo-t{font-family:var(--mono);font-size:13px;line-height:17px;font-weight:500;white-space:nowrap}
.nodo-t small{font-size:inherit;color:var(--muted);font-weight:400}
.nodo-e{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:14px;font-weight:500;color:var(--c,var(--muted));white-space:nowrap}
.nodo-e i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--control));display:inline-block;flex-shrink:0}
.nodo-e .c{display:none}
.nodo.est-amarillo .nodo-e i{animation:pulso 2.2s ease-in-out infinite}
.nodo.est-verde .nodo-e{color:var(--ok)}.nodo.est-amarillo .nodo-e{color:var(--warn-ink)}.nodo.est-rojo .nodo-e{color:var(--bad)}
.nodo.sel{border-color:var(--hue);border-top-color:var(--c,var(--hue));box-shadow:0 0 0 2px var(--rosa-m)}
.nodo.flash{animation:flash 1.1s var(--ease)}
.nodo.vacio{border-top-color:var(--control);border-style:dashed;background:transparent;color:var(--muted)}
.nodo.vacio .nodo-ico{color:var(--control);opacity:.7}
.nodo.vacio .nodo-e{color:var(--faint)}
button.nodo{cursor:pointer}
@media(hover:hover) and (pointer:fine){button.nodo:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(15,20,25,.1)}}
button.nodo:active{transform:scale(.97)}
button.nodo:focus-visible{outline:3px solid var(--rosa-m);outline-offset:1px}
@media(max-width:640px){.nodo{margin:0 1px 8px;padding:8px 0 6px}.nodo-t small{display:none}.nodo-t{font-size:12px}.nodo-e{font-size:10px;gap:3px}.nodo-e .l{display:none}.nodo-e .c{display:inline}.mapa{padding:12px 6px 4px}.mapa-dis .nodo-t small{display:inline}}
@media(max-width:420px){.mapa-hplc .nodo-e i{display:none}.mapa-hplc .nodo-e{letter-spacing:-.02em}}
.mapa-hint{text-align:center;color:var(--muted);margin:4px 0 16px}
.mapa-det{max-width:520px;margin:0 auto 20px}
.mapa-res{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.mapa-res .est-res{justify-content:flex-start;font-size:13px}
.mapa-falta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* Estados de análisis: texto + icono + color */
.an{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.an .ico{width:14px;height:14px}
.an-pend{background:#eceef2;color:#3d4650}
.an-proc{background:#e3edfb;color:#164a96}
.an-fin{background:var(--ok-bg);color:var(--ok-ink)}
.an-esp{background:#fff0e0;color:#9a4300;box-shadow:inset 0 0 0 1px #ffd2a1}
.an-proc .ico{animation:girar 3s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.acards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start;margin-bottom:20px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;min-width:0;transition:box-shadow 180ms var(--ease),border-color 140ms ease}
@media(hover:hover) and (pointer:fine){.acard:hover{border-color:var(--rosa-m);box-shadow:0 10px 26px rgba(163,25,104,.09)}}
.acard-cab{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(100deg,var(--rosa-p),var(--surface))}
.acard-cab .av{width:38px;height:38px;font-size:14px}
.acard-cab>div{flex:1;min-width:0}
.acard-cab b{display:block;font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-cab small{display:block;color:var(--muted);font-size:12px;line-height:16px}
.acard-n{min-width:26px;height:26px;border-radius:999px;background:var(--hue);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 8px}
.aitems{list-style:none;margin:0;padding:0}
.aitem{border-top:1px solid var(--rule)}
.aitem-b{display:flex;gap:10px;align-items:center;width:100%;padding:12px 16px;background:none;border:0;text-align:left;transition:background-color 120ms ease}
.aitem-b:focus-visible{outline:2px solid var(--hue);outline-offset:-2px}
.aitem-b .crece{flex:1;min-width:0}
.aitem-b b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem-b small{display:block;color:var(--muted);font-size:12px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem-b .chev{width:16px;height:16px;color:var(--faint);transition:transform 160ms var(--ease);flex-shrink:0}
.aitem.abierto .chev{transform:rotate(180deg)}
@media(hover:hover) and (pointer:fine){.aitem-b:hover{background:var(--rosa-p)}}
.aitem-det{padding:4px 16px 14px;display:flex;flex-direction:column;gap:10px;background:#fcf7fa}
.aitem-det dl.ficha{font-size:13px;gap:4px 14px}
.segest{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.segest button{display:flex;align-items:center;gap:6px;justify-content:center;height:34px;border:1px solid var(--control);background:var(--surface);border-radius:var(--r-ctl);font-size:13px;transition:transform 140ms var(--ease),background-color 120ms ease}
.segest button .ico{width:14px;height:14px}
.segest button:active{transform:scale(.97)}
.segest button[aria-pressed=true]{border-color:var(--hue);box-shadow:inset 0 0 0 1px var(--hue);font-weight:600;background:var(--rosa-p)}
.eqchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;background:#fff4cc;color:#7a4b00;border-radius:6px;padding:1px 6px}
.eqchip .ico{width:12px;height:12px}
.sin-asig{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.estres{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}

/* Planificador */
.modal-plan{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:0 0 16px}
.mod{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;transition:transform 180ms var(--ease),border-color 140ms ease,box-shadow 180ms var(--ease)}
.mod b{display:flex;align-items:center;gap:8px;font-size:14px}
.mod b .ico{width:18px;height:18px;color:var(--hue)}
.mod span.sub{font-size:12px}
.mod:disabled{opacity:.55;cursor:not-allowed}
@media(hover:hover) and (pointer:fine){.mod:not(:disabled):hover{transform:translateY(-2px);border-color:var(--rosa-m);box-shadow:0 8px 20px rgba(163,25,104,.1)}}
.mod:not(:disabled):active{transform:scale(.98)}
.cal{width:100%;border-collapse:separate;border-spacing:0}
.cal th,.cal td{vertical-align:top;border-bottom:1px solid var(--rule);border-left:1px solid var(--rule)}
.cal th:first-child,.cal td:first-child{border-left:0}
.cal thead th{background:var(--rosa-p);color:var(--mag-ink);text-align:center;font-weight:600;font-size:12px}
.cal td.nom{background:#fff;min-width:170px;position:sticky;left:0;z-index:1}
.cal td.celda{min-width:150px;padding:8px}
.cal td.celda.hoy{background:#fdf6fa}
.cal td.nada{text-align:center;color:var(--faint)}
.cal select{width:100%;margin:0 0 6px}
.cal select:last-of-type{margin-bottom:0}
.cal .resp{display:flex;flex-direction:column;gap:2px;font-size:12px;margin-bottom:6px}
.cal .resp:last-child{margin-bottom:0}
.cal .resp b{font-weight:500;font-size:13px}
.cal .inco select{border-color:var(--bad);background:var(--bad-bg)}
.inco-t{display:inline-flex;align-items:center;gap:4px;color:var(--bad-ink);font-size:11px;font-weight:500}
.inco-t .ico{width:12px;height:12px}
.cat-chip{display:inline-block;font-size:11px;font-weight:500;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.cat-ver{background:var(--rosa-p);color:var(--mag-ink)}.cat-act{background:#e7f1ec;color:#1d5a3e}
.rep{display:grid;grid-template-columns:minmax(90px,150px) minmax(80px,1fr) auto;gap:6px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule)}
.rep:last-child{border-bottom:0}
.rep .barra i{background:var(--hue)}
.rep.alto .barra i{background:var(--rosa)}
@media(max-width:560px){.rep{grid-template-columns:1fr auto}.rep .barra{grid-column:1/-1;order:3}}
.nota-eq{font-size:13px;color:var(--muted)}
/* v0.5: informes, indicadores, permisos */
.an-dev{background:#fdecee;color:var(--bad);box-shadow:inset 0 0 0 1px #f5c2c7}
.trio-parcial{display:flex;flex-wrap:wrap;justify-content:center}
.trio-parcial .trio-c{flex:1 1 240px;max-width:340px}
.inf-filtros{margin:0 0 10px}
.seg-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg-chips button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;font-weight:500;transition:background-color 140ms ease,color 140ms ease,border-color 140ms ease}
.seg-chips button:hover{border-color:var(--rosa-m);color:var(--tinta)}
.seg-chips button[aria-pressed=true]{background:var(--rosa-p);border-color:var(--rosa-m);color:var(--hue)}
.seg-chips button:active{transform:scale(.97)}
.inf-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.inf-chips .an{height:30px;padding:0 12px 0 10px;font-size:13px;border:0;cursor:pointer;transition:transform 120ms ease,box-shadow 140ms ease}
.inf-chips .an.sel{box-shadow:0 0 0 2px var(--hue)}
.inf-chips .an:active{transform:scale(.97)}
.inf-tablero{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));align-items:start;margin-bottom:24px}
.inf-col{background:var(--surface-2,#f1f2f5);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.inf-col-t{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;margin:2px 4px 2px;font-weight:600;color:var(--tinta)}
.inf-col-t .ico{width:16px;height:16px;color:var(--muted)}
.inf-vacio{color:var(--faint);font-size:13px;text-align:center;padding:18px 6px}
.inf-c{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.inf-c.flash{animation:destello 1.2s ease}
.inf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.inf-top b{font-size:15px;line-height:20px;overflow-wrap:anywhere}
.inf-obs{background:#fdecee;border:1px solid #f5c2c7;border-radius:10px;padding:8px 10px;font-size:13px;line-height:18px;color:#7a1d24}
.inf-obs p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.inf-acc{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.ind-ancha{grid-template-columns:minmax(0,46%) minmax(0,1fr) auto}
.sec-t small{margin-left:8px;font-weight:400}
.mes-graf{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:200px;align-items:stretch}
.mes-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:11px;color:var(--muted)}
.mes-v{height:14px;line-height:14px;font-variant-numeric:tabular-nums;color:var(--tinta);font-weight:500}
.mes-pista{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.mes-barra{display:block;width:100%;max-width:34px;background:var(--hue);border-radius:4px 4px 0 0;transition:height 360ms var(--ease)}
.mes-col.futuro .mes-m{opacity:.45}
.mes-tabla td,.mes-tabla th{white-space:nowrap}
.mes-tabla tr.tot td{border-top:2px solid var(--border)}

.inf-nota{margin:4px 0 0}
@media(max-width:1100px){.inf-tablero{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.inf-tablero{grid-template-columns:1fr}.inf-col:not(.sel){display:none}.inf-col{background:transparent;padding:0}.inf-col-t{display:none}}
.ind-rango{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:0 0 14px}
.ind-fechas{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.ind-fechas label{font-size:12px}
.ind-fechas input{height:34px}
.ind-kpis{margin-bottom:6px}
.ind-dos{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;margin-bottom:10px}
@media(max-width:820px){.ind-dos{grid-template-columns:1fr}}
.ind-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 16px}
.ind-card h3{font-size:14px;line-height:20px;margin:0 0 10px}
.ind-fila{display:grid;grid-template-columns:minmax(78px,30%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.ind-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tinta)}
.ind-v{color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ind-v i{font-style:normal;color:var(--faint)}
.ind-barra{height:10px;border-radius:999px;background:#eceef2;overflow:hidden}
.ind-barra i{display:block;height:100%;border-radius:999px;background:var(--hue);transition:width 360ms var(--ease)}
.ind-barra.ok i{background:var(--ok)}
@media(max-width:520px){.ind-fila,.ind-ancha{grid-template-columns:1fr auto;grid-template-areas:"n v" "b b"}.ind-fila .ind-n{grid-area:n}.ind-fila .ind-v{grid-area:v}.ind-fila .ind-barra{grid-area:b}}
.perm-f{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer}
label.perm-f{margin:0;font-weight:400;border-top:1px solid var(--rule)}

.perm-f+.perm-f{border-top:1px solid var(--rule)}
fieldset legend{font-weight:600;font-size:13px;color:var(--muted);padding:8px 0 4px}
.perm-f span b{display:block;font-size:14px;line-height:20px}
.perm-f span small{display:block;color:var(--muted);font-size:13px;line-height:18px}

/** Reemplaza solo los bloques que cambiaron, para no rehacer toda la pantalla por un dato. */
function parchar(viejo, nuevo, prof) {
  var a = Array.prototype.slice.call(viejo.childNodes), b = Array.prototype.slice.call(nuevo.childNodes);
  if (a.length !== b.length) { while (viejo.firstChild) viejo.removeChild(viejo.firstChild); b.forEach(function (n) { viejo.appendChild(n); }); return; }
  for (var i = 0; i < a.length; i++) {
    if (a[i].isEqualNode(b[i])) continue;
    if (prof > 0 && a[i].nodeType === 1 && b[i].nodeType === 1 && a[i].cloneNode(false).isEqualNode(b[i].cloneNode(false))) parchar(a[i], b[i], prof - 1);
    else viejo.replaceChild(b[i], a[i]);
  }
}
function pintar() {
  var cont = $('#contenido');
  if (!cont) return render();
  var t = document.createElement('template');
  t.innerHTML = contenido();
  parchar(cont, t.content, 4);
  S._json = S.datos ? JSON.stringify(S.datos) : null;
  S._min = Math.floor(Date.now() / 60000);
  document.querySelectorAll('.side [data-a="ir"],.bottom [data-a="ir"]').forEach(function (b) {
    var on = b.dataset.v === vistaNav(); b.classList.toggle('act', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  actualizarNav();
}
function ir(vista, param) {
  S.vista = vista; S.param = param || null;
  var c = S.vcache[claveVista()];
  S.datos = c ? c.d : null; // la última versión conocida se ve al instante y se refresca enseguida
  if (!$('#contenido')) render(); else pintar();
  window.scrollTo(0, 0);
  var it = navItems().filter(function (i) { return i[0] === vistaNav(); })[0];
  document.title = (it ? it[1] + ' · ' : '') + 'LabControl';
  var m = $('#contenido');
  if (m) { m.setAttribute('tabindex', '-1'); try { m.focus({ preventScroll: true }); } catch (e) { } }
  return cargar();
}
function cargar(silencioso) {
  var v = S.vista, p = S.param, key = claveVista(), ped = pedidoVista();
  var c = S.vcache[key];
  if (c && c.luego && Date.now() - c.t < 5000) { // recién llegada junto con la acción: no se vuelve a pedir
    c.luego = false;
    aplicar(v, p, key, c.d, silencioso);
    return Promise.resolve();
  }
  var pr;
  if (v === 'retro') pr = asegurarSug().then(function () { return {}; });
  else if (!ped) pr = Promise.resolve({});
  else pr = api(ped.accion, ped.datos);
  if (v === 'inicio') pr = pr.then(function (d) { // servidores anteriores no envían la lista de equipos con Inicio
    if (d.equipos) return d;
    return api('equipos').then(function (x) { d.equipos = x.equipos; return d; });
  });
  if (S.datos) sync(true);
  return pr.then(function (d) {
    sync(false);
    if (v !== 'retro') guardarVista(key, d);
    aplicar(v, p, key, d, silencioso);
  }).catch(function (e) {
    sync(false);
    if (!silencioso) { toast(e.message, 'error'); if (S.token && S.usuario) pintar(); }
  });
}
function aplicar(v, p, key, d, silencioso) {
  var nuevosAvisos = false;
  if (d && d.avisos && d.avisos.length) { // avisos recién entregados por el servidor: una sola vez
    d.avisos.forEach(function (a) { S.avisos.push(a); toast(a.texto); });
    d.avisos = []; nuevosAvisos = true;
  }
  if (v === 'inicio' && d && d.usuario) {
    var antesU = S.usuario ? JSON.stringify([S.usuario.roles, S.usuario.permisos]) : '';
    S.usuario = d.usuario;
    if (antesU && antesU !== JSON.stringify([d.usuario.roles, d.usuario.permisos]) && $('#contenido')) render(); // cambiaron sus permisos: el menú se adapta sin cerrar sesión
  }
  contadores(v, d);
  if ($('#contenido')) actualizarNav();
  if (v === 'verif' && d && d.fechas) iniciarDisp(d);
  if ((v === 'ocup' || v === 'hplc' || v === 'dis') && d && d.equipos) guardarVista('equipos|', { equipos: d.equipos, ahora: new Date().toISOString() });
  if ((v === 'inicio' || v === 'equipos' || v === 'ocup' || v === 'hplc' || v === 'dis') && d && d.equipos && S.datos && S.datos.equipos) { // cambios de estado: destello breve en la tarjeta
    var prev = {};
    S.datos.equipos.forEach(function (e) { prev[e.id] = e.estado + (e.ocupacion ? e.ocupacion.id : ''); });
    d.equipos.forEach(function (e) { if (prev[e.id] !== undefined && prev[e.id] !== e.estado + (e.ocupacion ? e.ocupacion.id : '')) S.flash[e.id] = 1; });
    if (Object.keys(S.flash).length) setTimeout(function () { S.flash = {}; }, 1300);
  }
  if (d && d.config) S.config = d.config;
  if (d && d.mensajes && !Array.isArray(d.mensajes)) S.msgs = d.mensajes;
  if (v === 'inicio' && d && d.equipos) guardarVista('equipos|', { equipos: d.equipos, ahora: new Date().toISOString() });
  if (v === 'inicio' || v === 'equipos') guardarSnap();
  if (puede('ANALISTA', 'JEFATURA') && !S.sug && (v === 'inicio' || v === 'equipos')) {
    setTimeout(function () { if (S.token && !S.sug) asegurarSug().catch(function () { }); }, 1200); // el formulario de ocupación abre sin esperar
  }
  if (S.vista !== v || S.param !== p || claveVista() !== key) return;
  if (S.usuario && S.usuario.debe_cambiar_clave) { render(); return; }
  var json = JSON.stringify(d);
  var mismo = !nuevosAvisos && S._json === json && S._min === Math.floor(Date.now() / 60000) && S.datos;
  S.datos = d;
  if (mismo) return; // nada cambió: la pantalla no se toca
  if (silencioso) {
    var foco = document.activeElement;
    if (S.modal || (foco && $('#contenido') && $('#contenido').contains(foco) && /INPUT|SELECT|TEXTAREA/.test(foco.tagName))) return;
  }
  pintar();
}
function asegurarSug() {
  if (S.sug) {
    // Se usan las sugerencias ya cargadas y se actualizan en segundo plano si quedaron viejas.
    if (S.sugVieja) { S.sugVieja = false; api('sugerencias').then(function (s) { S.sug = s; }).catch(function () { S.sugVieja = true; }); }
    return Promise.resolve(S.sug);
  }
  return api('sugerencias').then(function (s) { S.sug = s; return s; });
}

/* ---------- Mis tareas y planificador semanal ---------- */
var TA = { PENDIENTE: ['an-pend', 'Pendiente', 'clock'], EN_PROCESO: ['an-proc', 'En proceso', 'prog'], REALIZADA: ['an-fin', 'Completada', 'disp'], NO_REALIZADA: ['an-no', 'No realizada', 'noop'] };
function tBadge(e) { var x = TA[e] || TA.PENDIENTE; return '<span class="an ' + x[0] + '">' + ic(x[2]) + x[1] + '</span>'; }
var BASE_NOMBRES = ['pHímetro 7', 'pHímetro 8', 'Balanzas', 'Purificador de agua', 'Cambio de agua', 'Retiro de desechos'];
function frecTxt(v) { return v.dias && v.dias.length ? 'Solo ' + v.dias.map(function (n) { return DIAS[n]; }).join(' y ') : 'Todos los días'; }
function catChip(c) { return '<span class="cat-chip ' + (c === 'ACTIVIDAD' ? 'cat-act' : 'cat-ver') + '">' + (c === 'ACTIVIDAD' ? 'Actividad' : 'Verificación') + '</span>'; }

function itemVerif(a, acciones, conDia) {
  var hecho = a.estado === 'REALIZADA', no = a.estado === 'NO_REALIZADA', proc = a.estado === 'EN_PROCESO';
  var partes = [a.categoria === 'ACTIVIDAD' ? 'Actividad operativa' : 'Verificación'];
  if (a.procedimiento) partes.push(esc(a.procedimiento));
  if (a.equipo) partes.push('Equipo ' + esc(a.equipo));
  if (conDia) partes.push(esc(diaLargo(a.fecha)));
  var estado = '';
  if (hecho) estado = 'Completada' + (a.registrado_por ? ' por ' + esc(a.registrado_por) : '') + (a.registrado_en ? ' · ' + fh(a.registrado_en) : '');
  else if (no) estado = 'No realizada: ' + esc(a.motivo || 'sin motivo') + (a.registrado_por ? ' · ' + esc(a.registrado_por) : '');
  else if (proc) estado = 'En proceso' + (a.registrado_por ? ' · iniciada por ' + esc(a.registrado_por) : '') + (a.registrado_en ? ' · ' + hora(a.registrado_en) : '');
  var con = '';
  if (a.companeros && a.companeros.length) con = '<div class="sub">Responsables: <b>' + esc(a.usuario_id === S.usuario.id ? 'Tú' : 'Asignada') + '</b> y ' + a.companeros.map(function (c) { return esc(c.nombre || '—') + ' (' + (TA[c.estado] ? TA[c.estado][1].toLowerCase() : '') + ')'; }).join(', ') + '</div>';
  var der = '';
  if (acciones && (a.estado === 'PENDIENTE' || proc)) {
    der = '<div class="botones">' + (proc ? '' : '<button class="btn sec chico" data-a="verifIni" data-id="' + a.id + '">' + ic('play') + 'Iniciar</button>') +
      '<button class="btn chico" data-a="verifOk" data-id="' + a.id + '">' + ic('check') + 'Completada</button><button class="btn sec chico" data-a="verifNo" data-id="' + a.id + '" data-nombre="' + esc(a.nombre) + '">No realizada</button>' +
      (proc ? '<button class="btn ghost chico" data-a="verifRev" data-id="' + a.id + '" aria-label="Volver a pendiente: ' + esc(a.nombre) + '">' + ic('undo') + 'Pendiente</button>' : '') + '</div>';
  } else if (acciones) der = tBadge(a.estado) + '<button class="btn ghost chico" data-a="verifRev" data-id="' + a.id + '" aria-label="Revertir registro de ' + esc(a.nombre) + '">' + ic('undo') + 'Revertir</button>';
  else der = tBadge(a.estado);
  return '<div class="fila vf' + (S.flash[a.id] ? ' flash' : '') + '"><span class="ic' + (hecho || no ? ' hecho' : '') + '">' + (hecho ? ICO.disp : no ? ICO.noop : a.categoria === 'ACTIVIDAD' ? ICO.act : ICO.verif) + '</span>' +
    '<div class="crece"><b>' + esc(a.nombre) + '</b>' + (partes.length ? '<div class="sub">' + partes.join(' · ') + '</div>' : '') + con + (estado ? '<div class="sub">' + estado + '</div>' : '') + '</div>' + der + '</div>';
}

function repartoHtml(d) {
  var rp = (d.reparto || []).filter(function (x) { return x.asignaciones || x.dias; });

function diagHtml() {
  var l = S.diag.filter(function (x) { return x.ok; });
  if (!l.length) return '<p class="sub">Aún no hay mediciones.</p>';
  var ms = l.map(function (x) { return x.ms; }).sort(function (a, b) { return a - b; });
  var med = ms[Math.floor(ms.length / 2)];
  return '<p><b class="num">' + med + ' ms</b> <span class="sub">mediana de ' + ms.length + ' solicitudes · la más lenta ' + ms[ms.length - 1] + ' ms</span></p>' +
    '<table class="diag"><thead><tr><th>Acción</th><th class="num">ms</th></tr></thead><tbody>' +
    S.diag.slice(0, 8).map(function (x) { return '<tr><td>' + esc(x.a) + (x.ok ? '' : ' · error') + '</td><td class="num">' + x.ms + '</td></tr>'; }).join('') + '</tbody></table>';
}

function actualizarSugProd(form) {
  if (!form || !S.sug) return;
  var p = productoPorNombre(form.producto.value);
  var dl = form.querySelector('#dl-ens'), chips = form.querySelector('#chips-lotes');
  if (!p) { if (dl) dl.innerHTML = ''; if (chips) chips.innerHTML = ''; return; }
  var radio = form.querySelector('input[name=area][value="' + p.area + '"]');
  if (radio && !form.querySelector('input[name=area]:checked')) radio.checked = true;
  if (radio && form.dataset.ultProd !== p.id) { radio.checked = true; form.dataset.ultProd = p.id; }
  if (dl) dl.innerHTML = S.sug.ensayos.filter(function (x) { return x.producto_id === p.id; }).map(function (x) { return '<option value="' + esc(x.nombre) + '">'; }).join('');
  if (chips) chips.innerHTML = S.sug.lotes.filter(function (x) { return x.producto_id === p.id; }).slice(-8).reverse().map(function (x) { return '<button type="button" class="chip" data-a="agregarLote" data-l="' + esc(x.codigo) + '">+ ' + esc(x.codigo) + '</button>'; }).join('');

FORM.infReentregar = function (d) { return api('reentregarInforme', { id: d.id, lote: d.lote, referencia: d.referencia, nota: d.nota }).then(function () { return 'Informe entregado de nuevo.'; }); };
/* Indicadores */
ACC.indPre = function (ds) {
  var h = hoyYMD(), v = ds.v;
  S.indPre = v;
  if (v === '7') { S.indDesde = ymdAdd(h, -6); S.indHasta = h; }
  else if (v === '30') { S.indDesde = ''; S.indHasta = ''; }
  else if (v === 'mes') { S.indDesde = h.slice(0, 8) + '01'; S.indHasta = h; }
  else { var c = S.datos; S.indDesde = (c && c.desde) || ymdAdd(h, -29); S.indHasta = (c && c.hasta) || h; }
  var c2 = S.vcache[claveVista()]; S.datos = c2 ? c2.d : (v === 'otro' ? S.datos : null); pintar(); if (v !== 'otro') cargar();
};
FORM.indRango = function (d) {
  if (d.desde > d.hasta) throw new Error('La fecha inicial no puede ser posterior a la final.');
  S.indDesde = d.desde; S.indHasta = d.hasta; S.indPre = 'otro'; S.datos = null; pintar(); cargar(); return 'silencio';
};
ACC.imprimir = function () { window.print(); };
/* Uso mensual */

};
ACC.indAnio = function (ds) {

};
ACC.csvAnual = function () {
  var d = S.datos; if (!d || !d.tipos) return;
  var f = function (n) { return String(n).replace('.', ','); }, filas = [['Tipo', 'Código', 'Equipo'].concat(MESES, ['Total horas'])];
  ['HPLC', 'DISOLUTOR'].forEach(function (k) {
    d.tipos[k].lista.forEach(function (e) { filas.push([k === 'HPLC' ? 'HPLC' : 'Disolutor', e.codigo, e.nombre].concat(e.horas.map(f), [f(e.total)])); });
    filas.push([k === 'HPLC' ? 'HPLC' : 'Disolutor', 'TOTAL', ''].concat(d.tipos[k].meses.map(function (m) { return f(m.horas); }), [f(d.tipos[k].horas)]));
  });
  var csv = '﻿' + filas.map(function (r) { return r.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'uso-equipos-' + d.anio + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  toast('Archivo CSV descargado.');
};

    .then(function () { S.verifDispKey = ''; return 'Tarea guardada.'; });

document.addEventListener('click', function (ev) {
  if (ev.target.dataset && ev.target.dataset.fondo) { ACC.cerrarModal(); return; }
  var el = ev.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  var fn = ACC[el.dataset.a];
  if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el.dataset, el, ev); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if ((el.tagName === 'INPUT' || el.tagName === 'SELECT') && el.dataset.a && ACC[el.dataset.a]) ACC[el.dataset.a](el.dataset, el, ev);
  if (el.dataset.r !== undefined && el.dataset.k && S.retro) actualizarFilaRetro(el);
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.dataset.prod) actualizarSugProd(el.form);
  if (el.dataset.r !== undefined && el.dataset.k && S.retro) actualizarFilaRetro(el);
  if (el.dataset.busca === 'eq') {
    S.buscaEq = el.value;
    var pos = el.selectionStart;
    pintar();
    var n = document.querySelector('[data-busca="eq"]');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
  }
  if (el.dataset.busca === 'enc') {
    S._qEnc = el.value;
    var q = norm(el.value);
    $('#lista-enc').innerHTML = listaEncHtml((S.usuariosEnc || []).filter(function (u) { return !q || norm(u.nombre).indexOf(q) >= 0; }));
  }
});
document.addEventListener('focusin', function (ev) { if (ev.target.dataset && ev.target.dataset.sel) ev.target.select(); });
function actualizarFilaRetro(el) {
  var f = S.retro[Number(el.dataset.r)];
  if (!f) return;
  f[el.dataset.k] = el.value;
  if (el.dataset.k === 'producto') {
    var p = productoPorNombre(el.value);
    if (p && !f.area) {
      f.area = p.area;
      var sel = document.querySelector('select[data-r="' + el.dataset.r + '"][data-k="area"]');
      if (sel) sel.value = p.area;
    }
  }
}
document.addEventListener('submit', function (ev) {
  var f = ev.target, nombre = f.dataset.f;
  if (!nombre || !FORM[nombre]) return;
  ev.preventDefault();
  var btn = f.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  var p;
  try { p = Promise.resolve(FORM[nombre](fdatos(f), f)); } catch (e) { p = Promise.reject(e); }
  p.then(function (msg) {
    if (btn) btn.disabled = false;
    if (msg === 'silencio' || msg === undefined) return;
    cerrarModal(); toast(msg); cargar();
  }).catch(function (e) { if (btn) btn.disabled = false; toast(e.message, 'error'); });
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.modal) ACC.cerrarModal(); });

/* ---------- Sesión ---------- */
function cargarYo() {
  return api('yo').then(function (d) {
    S.usuario = d.usuario; S.config = d.config; S.msgs = d.mensajes; S.notifEmail = d.notif_email_activo;
    guardarVista('perfil|', d);
    return d;
  });
}
function cerrarLocal() {
  S.token = null; S.usuario = null; S.datos = null; S.sug = null; S.avisos = []; S.retro = null;
  S.vcache = {}; S._json = null; S.verifRes = null; S.encPend = 0; S.selEq = null; S.verifDispKey = '';
  store.del('lc_token'); store.del('lc_snap');
  cerrarModal(); render();
}
function iniciarPolling() {
  if (S._poll) return;
  S._poll = setInterval(function () {
    if (!S.token || !S.usuario || S.usuario.debe_cambiar_clave || document.hidden || S.modal) return;
    if (POLL.indexOf(S.vista) < 0) return;
    cargar(true);
  }, Math.max(10, (S.config && S.config.segundos_refresco) || 20) * 1000);
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.token && S.usuario && !S.modal && POLL.indexOf(S.vista) >= 0) cargar(true);
});

/* ---------- Modo televisor ---------- */
function pintarTV(d) {
  var reloj = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (!d) { $('#app').innerHTML = '<div class="tv-error">Cargando panel…</div>'; return; }
  var tile = function (e) {
    var col = EST[e.estado][0];
    var det = e.estado === 'OCUPADO' ? (e.area ? e.area + ' · ' : '') + (e.ensayo ? esc(e.ensayo) + ' · ' : '') + dur(e.inicio)
      : e.estado === 'DISPONIBLE' && e.proxima ? 'Reservado desde ' + hora(e.proxima) : '';
    return '<div class="tv-eq ' + col + '"><span class="ico" aria-hidden="true">' + icoEq(e) + '</span><div class="c">' + esc(e.codigo) + '</div><div class="e">' + EST[e.estado][1] + '</div><div class="d">' + det + '</div></div>';
  };
  var r = d.resumen;
  var hplc = d.equipos.filter(function (e) { return e.tipo === 'HPLC'; }), dis = d.equipos.filter(function (e) { return e.tipo === 'DISOLUTOR'; });
  $('#app').innerHTML = '<div class="tv"><div class="tv-cab"><h1>' + esc(d.laboratorio || 'LabControl') + '</h1><div class="tv-reloj" id="tv-reloj">' + reloj + '</div></div>' +
    '<div class="tv-res"><div>HPLC disponibles<b>' + r.HPLC.DISPONIBLE + ' / ' + hplc.length + '</b></div><div>Disolutores disponibles<b>' + r.DISOLUTOR.DISPONIBLE + ' / ' + dis.length + '</b></div>' +
    '<div>No operativos<b>' + (r.HPLC.NO_OPERATIVO + r.DISOLUTOR.NO_OPERATIVO) + '</b></div><div>Usos activos MP<b>' + d.actividades.MP + '</b></div><div>Usos activos PT<b>' + d.actividades.PT + '</b></div>' + (d.verif && d.verif.total ? '<div>Verificaciones de hoy<b>' + d.verif.realizadas + ' / ' + d.verif.total + '</b></div>' : '') + '</div>' +
    '<div class="tv-leyenda"><span><i style="background:#3fc07a"></i>Disponible</span><span><i style="background:#f0b429"></i>En uso</span><span><i style="background:#e5566f"></i>No operativo</span></div>' +
    (hplc.length ? '<h2>HPLC</h2><div class="tv-grid">' + hplc.map(tile).join('') + '</div>' : '') +
    (dis.length ? '<h2>Disolutores</h2><div class="tv-grid">' + dis.map(tile).join('') + '</div>' : '') + '</div>';
}
function iniciarTV() {
  document.body.classList.add('modo-tv');
  pintarTV(null);
  var tick = function () {
    api('tvEstado', { tv: TV_TOKEN }).then(function (d) { pintarTV(d); setTimeout(tick, (d.segundos || 20) * 1000); })
      .catch(function (e) { $('#app').innerHTML = '<div class="tv-error">' + esc(e.message) + '</div>'; setTimeout(tick, 60000); });
  };
  tick();
  setInterval(function () { var c = $('#tv-reloj'); if (c) c.textContent = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hour12: false }); }, 10000);
}

/* ---------- Arranque ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
function boot() {
  if (MODO === 'tv') { iniciarTV(); return; }
  var s = document.createElement('div'); s.id = 'sync'; s.setAttribute('aria-hidden', 'true'); document.body.appendChild(s);
  S.token = store.get('lc_token');
  if (!S.token) { render(); return; }
  S.vista = 'inicio'; S.param = null;
  var snap = jparse(store.get('lc_snap'), null);
  if (snap && snap.token === S.token && snap.usuario && !snap.usuario.debe_cambiar_clave) {
    S.usuario = snap.usuario; S.config = snap.config || {}; S.msgs = snap.msgs || {};
    Object.keys(snap.v || {}).forEach(function (k) { S.vcache[k] = { d: snap.v[k].d, t: 0 }; });
    S.datos = S.vcache['inicio|'] ? S.vcache['inicio|'].d : null;
    contadores('inicio', S.datos);
    render(); // última versión conocida, al instante; se refresca a continuación
    cargar();
    return;
  }
  $('#app').innerHTML = '<main style="max-width:1240px;margin:0 auto;padding:24px 16px">' + cargandoHtml() + '</main>';
  api('inicio').then(function (d) {
    if (d.equipos) guardarVista('inicio|', d, true);
    S.usuario = d.usuario;
    contadores('inicio', d);
    render();
    if (!S.usuario.debe_cambiar_clave) ir('inicio');
  }).catch(function (e) {
    if (!S.token) return; // la sesión expiró: ya se muestra el ingreso
    $('#app').innerHTML = '<div class="login"><div class="card"><div class="marca">' + MARCA + 'LabControl</div><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Reintentar</button></div></div>';
  });
}
boot();
</script>
